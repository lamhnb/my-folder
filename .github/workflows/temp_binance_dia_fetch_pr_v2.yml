name: Temporary Binance DIA archive fetch PR v2

on:
  pull_request:
    paths:
      - 'temp/binance_dia_fetch_request_pr_20260726.txt'

permissions:
  contents: read

jobs:
  fetch-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download official Binance historical data robustly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/futures artifact/spot artifact/rest
          python3 - <<'PY'
          import hashlib, json, time, urllib.error, urllib.parse, urllib.request
          from datetime import date, timedelta, datetime, timezone
          from pathlib import Path

          ROOT=Path('artifact'); SYMBOL='DIAUSDT'; INTERVAL='5m'
          START=date(2026,7,15); END=date(2026,7,25)
          errors=[]; manifest=[]

          def get_bytes(url, attempts=4):
              delay=1.0; last=None
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 v14-fresh-backtest'})
                      with urllib.request.urlopen(req,timeout=60) as resp: return resp.read()
                  except Exception as exc:
                      last=exc
                      if attempt+1<attempts: time.sleep(delay); delay*=2
              raise last

          day=START
          while day<=END:
              stamp=day.isoformat()
              for market,prefix in [('futures','futures/um/daily/klines'),('spot','spot/daily/klines')]:
                  filename=f'{SYMBOL}-{INTERVAL}-{stamp}.zip'
                  url=f'https://data.binance.vision/data/{prefix}/{SYMBOL}/{INTERVAL}/{filename}'
                  out=ROOT/market/filename
                  try:
                      payload=get_bytes(url); out.write_bytes(payload)
                      digest=hashlib.sha256(payload).hexdigest()
                      checksum=None
                      try:
                          checksum=get_bytes(url+'.CHECKSUM').decode('utf-8',errors='replace').strip()
                          (out.parent/(filename+'.CHECKSUM')).write_text(checksum+'\n',encoding='utf-8')
                      except Exception as exc: errors.append({'url':url+'.CHECKSUM','error':repr(exc)})
                      manifest.append({'url':url,'path':str(out),'bytes':len(payload),'sha256':digest,'official_checksum':checksum,'status':200})
                  except Exception as exc:
                      errors.append({'url':url,'error':repr(exc)})
                      manifest.append({'url':url,'status':'ERROR','error':repr(exc)})
              day+=timedelta(days=1)

          def get_json(base,path,params):
              url=base.rstrip('/')+path+'?'+urllib.parse.urlencode(params)
              return json.loads(get_bytes(url).decode('utf-8'))

          start_ms=int(datetime(2026,7,15,tzinfo=timezone.utc).timestamp()*1000)
          end_ms=int(datetime(2026,7,25,23,59,59,999000,tzinfo=timezone.utc).timestamp()*1000)
          oi={}; funding={}; dia_info=None
          try:
              cursor=start_ms; step=300000
              while cursor<=end_ms:
                  rows=get_json('https://fapi.binance.com','/futures/data/openInterestHist',{'symbol':SYMBOL,'period':'5m','startTime':cursor,'endTime':end_ms,'limit':500})
                  if not rows: break
                  for row in rows:
                      ts=int(row['timestamp'])
                      if start_ms<=ts<=end_ms: oi[ts]=row
                  nxt=int(rows[-1]['timestamp'])+step
                  if nxt<=cursor: break
                  cursor=nxt; time.sleep(.08)
          except Exception as exc: errors.append({'source':'openInterestHist','error':repr(exc)})
          (ROOT/'rest'/'DIAUSDT-open-interest-5m-2026-07-15_2026-07-25.json').write_text(json.dumps([oi[k] for k in sorted(oi)],indent=2),encoding='utf-8')

          try:
              cursor=start_ms
              while cursor<=end_ms:
                  rows=get_json('https://fapi.binance.com','/fapi/v1/fundingRate',{'symbol':SYMBOL,'startTime':cursor,'endTime':end_ms,'limit':1000})
                  if not rows: break
                  for row in rows:
                      ts=int(row['fundingTime'])
                      if start_ms<=ts<=end_ms: funding[ts]=row
                  nxt=int(rows[-1]['fundingTime'])+1
                  if nxt<=cursor: break
                  cursor=nxt; time.sleep(.08)
          except Exception as exc: errors.append({'source':'fundingRate','error':repr(exc)})
          (ROOT/'rest'/'DIAUSDT-funding-2026-07-15_2026-07-25.json').write_text(json.dumps([funding[k] for k in sorted(funding)],indent=2),encoding='utf-8')

          try:
              info=get_json('https://fapi.binance.com','/fapi/v1/exchangeInfo',{})
              dia_info=next((s for s in info.get('symbols',[]) if s.get('symbol')==SYMBOL),None)
          except Exception as exc: errors.append({'source':'exchangeInfo','error':repr(exc)})
          (ROOT/'rest'/'DIAUSDT-exchange-info.json').write_text(json.dumps(dia_info,indent=2),encoding='utf-8')

          provenance={'symbol':SYMBOL,'interval':INTERVAL,'requested_start_utc':'2026-07-15T00:00:00Z','requested_end_utc':'2026-07-25T23:59:59.999Z','downloaded_at_utc':datetime.now(timezone.utc).isoformat(),'archive_manifest':manifest,'oi_rows':len(oi),'funding_rows':len(funding),'errors':errors,'source':'Official Binance Data Vision archives and Binance USD-M public REST API'}
          (ROOT/'PROVENANCE.json').write_text(json.dumps(provenance,indent=2),encoding='utf-8')
          hashes=[]
          for path in sorted(ROOT.rglob('*')):
              if path.is_file() and path.name!='SHA256SUMS.txt': hashes.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(ROOT)}")
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(hashes)+'\n',encoding='utf-8')
          print(json.dumps(provenance,indent=2))
          if not any(item.get('status')==200 for item in manifest): raise SystemExit('No archive files were downloaded')
          PY
      - name: Upload fresh raw dataset
        uses: actions/upload-artifact@v4
        with:
          name: dia-fresh-binance-20260715-20260725-v2
          path: artifact
          if-no-files-found: error
          retention-days: 3
