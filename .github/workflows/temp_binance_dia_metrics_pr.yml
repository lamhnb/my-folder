name: Temporary Binance DIA metrics fetch PR

on:
  pull_request:
    paths:
      - 'temp/binance_dia_metrics_request_pr_20260726.txt'

permissions:
  contents: read

jobs:
  fetch-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Binance futures metrics and funding archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/metrics artifact/funding
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from datetime import date, timedelta, datetime, timezone
          from pathlib import Path
          ROOT=Path('artifact'); SYMBOL='DIAUSDT'; START=date(2026,7,15); END=date(2026,7,25)
          errors=[]; manifest=[]
          def get(url, attempts=4):
              delay=1
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 v14-fresh-backtest'})
                      with urllib.request.urlopen(req,timeout=60) as r: return r.read()
                  except Exception as exc:
                      if attempt+1==attempts: raise
                      time.sleep(delay); delay*=2
          day=START
          while day<=END:
              stamp=day.isoformat()
              specs=[
                ('metrics',f'{SYMBOL}-metrics-{stamp}.zip',f'https://data.binance.vision/data/futures/um/daily/metrics/{SYMBOL}/{SYMBOL}-metrics-{stamp}.zip'),
                ('funding',f'{SYMBOL}-fundingRate-{stamp}.zip',f'https://data.binance.vision/data/futures/um/daily/fundingRate/{SYMBOL}/{SYMBOL}-fundingRate-{stamp}.zip'),
              ]
              for group,name,url in specs:
                  out=ROOT/group/name
                  try:
                      payload=get(url); out.write_bytes(payload)
                      digest=hashlib.sha256(payload).hexdigest(); checksum=None
                      try:
                          checksum=get(url+'.CHECKSUM').decode().strip()
                          (out.parent/(name+'.CHECKSUM')).write_text(checksum+'\n')
                      except Exception as exc: errors.append({'url':url+'.CHECKSUM','error':repr(exc)})
                      manifest.append({'group':group,'url':url,'path':str(out),'bytes':len(payload),'sha256':digest,'official_checksum':checksum,'status':200})
                  except Exception as exc:
                      errors.append({'url':url,'error':repr(exc)})
                      manifest.append({'group':group,'url':url,'status':'ERROR','error':repr(exc)})
              day+=timedelta(days=1)
          prov={'symbol':SYMBOL,'start':START.isoformat(),'end':END.isoformat(),'downloaded_at_utc':datetime.now(timezone.utc).isoformat(),'manifest':manifest,'errors':errors,'source':'Official Binance Data Vision futures UM archives'}
          (ROOT/'PROVENANCE.json').write_text(json.dumps(prov,indent=2))
          hashes=[]
          for p in sorted(ROOT.rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS.txt': hashes.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(ROOT)}")
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(hashes)+'\n')
          print(json.dumps(prov,indent=2))
          if not any(x.get('status')==200 and x.get('group')=='metrics' for x in manifest): raise SystemExit('No metrics archives downloaded')
          PY
      - name: Upload fresh metrics dataset
        uses: actions/upload-artifact@v4
        with:
          name: dia-fresh-metrics-20260715-20260725
          path: artifact
          if-no-files-found: error
          retention-days: 3
