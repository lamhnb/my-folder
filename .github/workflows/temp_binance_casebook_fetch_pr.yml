name: Temporary Binance casebook raw-data fetch PR

on:
  pull_request:
    paths:
      - 'temp/binance_casebook_request_pr_20260726.txt'

permissions:
  contents: read

jobs:
  fetch-casebook:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download official Binance casebook archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/futures artifact/spot artifact/metrics
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from datetime import date, timedelta, datetime, timezone
          from pathlib import Path
          ROOT=Path('artifact')
          SYMBOLS=['AVAAIUSDT','ZAMAUSDT','EULUSDT','BANKUSDT','SAPIENUSDT','MMTUSDT','OPENUSDT','INJUSDT','SYNUSDT','PARTIUSDT','EIGENUSDT','NEOUSDT','DIAUSDT']
          START=date(2026,7,7); END=date(2026,7,25); INTERVAL='5m'
          manifest=[]; errors=[]
          def get(url,attempts=3):
              delay=.5
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 v14-casebook-backtest'})
                      with urllib.request.urlopen(req,timeout=45) as r: return r.read()
                  except Exception as exc:
                      if attempt+1==attempts: raise
                      time.sleep(delay); delay*=2
          def fetch(group,name,url,out):
              try:
                  payload=get(url); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(payload)
                  digest=hashlib.sha256(payload).hexdigest(); checksum=None
                  try:
                      checksum=get(url+'.CHECKSUM').decode().strip(); Path(str(out)+'.CHECKSUM').write_text(checksum+'\n')
                  except Exception as exc: errors.append({'url':url+'.CHECKSUM','error':repr(exc)})
                  manifest.append({'group':group,'url':url,'path':str(out),'bytes':len(payload),'sha256':digest,'official_checksum':checksum,'status':200})
              except Exception as exc:
                  manifest.append({'group':group,'url':url,'status':'ERROR','error':repr(exc)})
          for symbol in SYMBOLS:
              day=START
              while day<=END:
                  stamp=day.isoformat()
                  for group,prefix in [('futures','futures/um/daily/klines'),('spot','spot/daily/klines')]:
                      name=f'{symbol}-{INTERVAL}-{stamp}.zip'
                      url=f'https://data.binance.vision/data/{prefix}/{symbol}/{INTERVAL}/{name}'
                      fetch(group,name,url,ROOT/group/name)
                  mname=f'{symbol}-metrics-{stamp}.zip'
                  murl=f'https://data.binance.vision/data/futures/um/daily/metrics/{symbol}/{mname}'
                  fetch('metrics',mname,murl,ROOT/'metrics'/mname)
                  day+=timedelta(days=1)
          prov={'symbols':SYMBOLS,'interval':INTERVAL,'start':START.isoformat(),'end':END.isoformat(),'downloaded_at_utc':datetime.now(timezone.utc).isoformat(),'manifest':manifest,'errors':errors,'source':'Official Binance Data Vision archives'}
          (ROOT/'PROVENANCE.json').write_text(json.dumps(prov,indent=2))
          hashes=[]
          for p in sorted(ROOT.rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS.txt': hashes.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(ROOT)}")
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(hashes)+'\n')
          successful={s:sum(1 for x in manifest if x.get('status')==200 and s in str(x.get('path','')) and x.get('group')=='futures') for s in SYMBOLS}
          print(json.dumps({'successful_futures_days':successful,'total_files':sum(1 for x in manifest if x.get('status')==200),'errors':len(errors)},indent=2))
          if sum(successful.values())<30: raise SystemExit('Insufficient fresh futures archives')
          PY
      - name: Upload fresh casebook dataset
        uses: actions/upload-artifact@v4
        with:
          name: binance-fresh-casebook-20260707-20260725
          path: artifact
          if-no-files-found: error
          retention-days: 3
