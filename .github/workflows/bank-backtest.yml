name: TAG historical data download

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download official Binance TAGUSDT history
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date, timedelta
          from pathlib import Path
          import urllib.error
          import urllib.request

          root = Path('tag_history')
          symbol = 'TAGUSDT'
          start = date(2026, 3, 15)
          end = date(2026, 5, 5)

          jobs = []
          day = start
          while day <= end:
              stamp = day.isoformat()
              for market, prefix in [
                  ('futures', 'futures/um/daily/klines'),
                  ('spot', 'spot/daily/klines'),
              ]:
                  filename = f'{symbol}-5m-{stamp}.zip'
                  url = f'https://data.binance.vision/data/{prefix}/{symbol}/5m/{filename}'
                  jobs.append((url, root / market / symbol / filename, market, stamp))
              day += timedelta(days=1)

          def fetch(job):
              url, out, market, stamp = job
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'pump-scanner-replay/1.4.0'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = response.read()
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(payload)
                  return ('OK', market, stamp, len(payload))
              except urllib.error.HTTPError as exc:
                  return ('MISS' if exc.code == 404 else 'ERROR', market, stamp, exc.code)
              except Exception as exc:
                  return ('ERROR', market, stamp, f'{type(exc).__name__}:{exc}')

          counts = {'OK': 0, 'MISS': 0, 'ERROR': 0}
          with ThreadPoolExecutor(max_workers=16) as executor:
              futures = [executor.submit(fetch, job) for job in jobs]
              for future in as_completed(futures):
                  result = future.result()
                  counts[result[0]] += 1
                  print(*result)

          root.mkdir(parents=True, exist_ok=True)
          (root / 'summary.txt').write_text(str(counts), encoding='utf-8')
          print('SUMMARY', counts)
          PY

      - name: Inventory
        if: always()
        shell: bash
        run: |
          find tag_history -type f -printf '%p %s bytes\n' | sort | tee tag_history_inventory.txt
          du -sh tag_history || true

      - name: Upload TAG history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-history-2026-04-30
          path: |
            tag_history/**
            tag_history_inventory.txt
          if-no-files-found: warn
          retention-days: 7
