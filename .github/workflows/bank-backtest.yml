name: BANK historical backtest

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decode scanner package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          src = Path('scanner_backtest/bank_bt_min.zip.b64')
          raw = src.read_text(encoding='utf-8').strip()
          Path('scanner_backtest/bank_bt_min.zip').write_bytes(base64.b64decode(raw))
          PY
          cd scanner_backtest
          unzip -q bank_bt_min.zip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner_backtest/bank_bt_min/requirements.txt

      - name: Run BANKUSDT point-in-time replay
        shell: bash
        run: |
          cd scanner_backtest/bank_bt_min
          mkdir -p historical_reports historical_data/cache
          python tools/run_historical_replay.py \
            --symbol BANKUSDT \
            --history-start 2026-06-01 \
            --start 2026-07-01 \
            --end 2026-07-20 \
            --interval 5m \
            --cache-dir historical_data/cache \
            --output-dir historical_reports \
            --config config.yaml 2>&1 | tee bank_backtest.log

      - name: Inventory outputs
        if: always()
        shell: bash
        run: |
          find scanner_backtest/bank_bt_min -maxdepth 4 -type f -printf '%p %s bytes\n' | sort > scanner_backtest/output_inventory.txt
          cat scanner_backtest/output_inventory.txt

      - name: Upload BANK backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-backtest-result
          path: |
            scanner_backtest/bank_bt_min/historical_reports/**
            scanner_backtest/bank_bt_min/bank_backtest.log
            scanner_backtest/output_inventory.txt
          if-no-files-found: warn
          retention-days: 7
