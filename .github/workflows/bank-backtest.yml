name: V17 official full-data cutoff dataset

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official Binance archives
        shell: bash
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date, timedelta
          from pathlib import Path
          import json, urllib.error, urllib.request, zipfile

          symbols = [x.strip() for x in Path('scanner_validation/universe_20260719_spotproxy.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          dates=[]
          d=date(2026,7,17)
          while d<=date(2026,7,20):
              dates.append(d.isoformat()); d+=timedelta(days=1)
          root=Path('official_cutoff20_raw')
          jobs=[]
          for symbol in symbols:
              for stamp in dates:
                  specs=[
                    ('futures_klines', f'https://data.binance.vision/data/futures/um/daily/klines/{symbol}/5m/{symbol}-5m-{stamp}.zip', f'{symbol}-5m-{stamp}.zip'),
                    ('spot_klines', f'https://data.binance.vision/data/spot/daily/klines/{symbol}/5m/{symbol}-5m-{stamp}.zip', f'{symbol}-5m-{stamp}.zip'),
                    ('futures_metrics', f'https://data.binance.vision/data/futures/um/daily/metrics/{symbol}/{symbol}-metrics-{stamp}.zip', f'{symbol}-metrics-{stamp}.zip'),
                  ]
                  for kind,url,name in specs:
                      jobs.append((symbol,stamp,kind,url,root/symbol/kind/name))

          def fetch(job):
              symbol,stamp,kind,url,out=job
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'scanner-v1.7-official-validation'})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      data=r.read()
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(data)
                  with zipfile.ZipFile(out) as z:
                      bad=z.testzip()
                      if bad: raise RuntimeError(f'bad zip member {bad}')
                  return {'status':'OK','symbol':symbol,'date':stamp,'kind':kind,'bytes':len(data)}
              except urllib.error.HTTPError as e:
                  return {'status':'MISS' if e.code==404 else 'ERROR','symbol':symbol,'date':stamp,'kind':kind,'error':str(e.code)}
              except Exception as e:
                  return {'status':'ERROR','symbol':symbol,'date':stamp,'kind':kind,'error':f'{type(e).__name__}:{e}'}

          results=[]
          with ThreadPoolExecutor(max_workers=32) as pool:
              fs=[pool.submit(fetch,j) for j in jobs]
              for i,f in enumerate(as_completed(fs),1):
                  results.append(f.result())
                  if i%250==0: print(f'[DOWNLOAD] {i}/{len(fs)}',flush=True)

          universe=[]
          for symbol in symbols:
              probe=root/symbol/'futures_klines'/f'{symbol}-5m-2026-07-19.zip'
              if probe.exists(): universe.append(symbol)
              meta={
                'symbol':symbol,
                'source':'Binance Data Vision official daily archives',
                'requested_dates':dates,
                'download_run':'github-actions',
              }
              (root/symbol).mkdir(parents=True,exist_ok=True)
              (root/symbol/'metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
              rest=root/symbol/'rest'; rest.mkdir(exist_ok=True)
              for name in ('funding.json','open_interest_5m.json','global_long_short_5m.json','taker_long_short_5m.json','top_account_long_short_5m.json','top_position_long_short_5m.json'):
                  (rest/name).write_text('[]',encoding='utf-8')

          root.mkdir(exist_ok=True)
          (root/'historical_futures_universe.txt').write_text('\n'.join(universe)+'\n',encoding='utf-8')
          counts={}
          for r in results:
              key=f"{r['kind']}:{r['status']}"; counts[key]=counts.get(key,0)+1
          summary={'input_symbols':len(symbols),'historical_futures_symbols':len(universe),'dates':dates,'counts':counts}
          (root/'download_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          (root/'download_results.json').write_text(json.dumps(results),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Inventory and size
        shell: bash
        run: |
          find official_cutoff20_raw -type f | wc -l
          du -sh official_cutoff20_raw
          cat official_cutoff20_raw/download_summary.json
      - name: Upload official cutoff dataset
        uses: actions/upload-artifact@v4
        with:
          name: v17-official-full-data-cutoff20
          path: official_cutoff20_raw/**
          retention-days: 7
          compression-level: 0
