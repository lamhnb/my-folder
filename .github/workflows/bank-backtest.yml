name: V17 historical cutoff 20 July raw data

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install aiohttp
      - name: Download point-in-time Spot candles
        shell: bash
        run: |
          cat > /tmp/download.py <<'PY'
          import asyncio, aiohttp, gzip, json
          from datetime import datetime, timezone
          from pathlib import Path

          BASE='https://data-api.binance.vision'
          CUTOFF=int(datetime(2026,7,19,17,0,tzinfo=timezone.utc).timestamp()*1000) # 20/7 00:00 VN
          START=CUTOFF-48*3600_000
          END=CUTOFF+24*3600_000

          async def get(session,path,params=None,retries=7):
              delay=.5
              for i in range(retries):
                  try:
                      async with session.get(BASE+path,params=params) as r:
                          txt=await r.text()
                          if r.status in (418,429):
                              await asyncio.sleep(delay); delay=min(10,delay*2); continue
                          if r.status!=200: raise RuntimeError(f'HTTP {r.status}: {txt[:120]}')
                          return json.loads(txt)
                  except Exception:
                      if i==retries-1: raise
                      await asyncio.sleep(delay); delay=min(10,delay*2)

          async def fetch_symbol(session,sem,symbol,out):
              async with sem:
                  try:
                      rows=await get(session,'/api/v3/klines',{
                          'symbol':symbol,'interval':'5m','startTime':START,'endTime':END,'limit':1000
                      })
                      if len(rows)<300:
                          return symbol,'SHORT',len(rows)
                      payload=json.dumps(rows,separators=(',',':')).encode()
                      with gzip.open(out/f'{symbol}.json.gz','wb',compresslevel=6) as h:h.write(payload)
                      return symbol,'OK',len(rows)
                  except Exception as e:
                      return symbol,'ERROR',f'{type(e).__name__}:{e}'

          async def main():
              out=Path('historical20_raw'); out.mkdir(exist_ok=True)
              timeout=aiohttp.ClientTimeout(total=60); conn=aiohttp.TCPConnector(limit=25)
              async with aiohttp.ClientSession(timeout=timeout,connector=conn,headers={'User-Agent':'v17-historical-cutoff'}) as s:
                  info=await get(s,'/api/v3/exchangeInfo')
                  syms=[x['symbol'] for x in info['symbols'] if x.get('status')=='TRADING' and x.get('quoteAsset')=='USDT' and x.get('isSpotTradingAllowed',True)]
                  sem=asyncio.Semaphore(12)
                  tasks=[fetch_symbol(s,sem,sym,out) for sym in syms]
                  results=[]
                  for i,t in enumerate(asyncio.as_completed(tasks),1):
                      results.append(await t)
                      if i%50==0: print(f'DOWNLOADED {i}/{len(tasks)}',flush=True)
              meta={'cutoff_ms':CUTOFF,'start_ms':START,'end_ms':END,'universe_count':len(syms),'results':results}
              (out/'metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
              ok=sum(r[1]=='OK' for r in results); print('SUMMARY',len(syms),ok)
          asyncio.run(main())
          PY
          python /tmp/download.py
      - name: Inventory
        run: |
          du -sh historical20_raw
          find historical20_raw -type f | wc -l
      - name: Upload raw dataset
        uses: actions/upload-artifact@v4
        with:
          name: v17-historical-cutoff-20jul-spot-raw
          path: historical20_raw/**
          retention-days: 7
