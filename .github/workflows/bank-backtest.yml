name: Pump benchmark archive download

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download ONUSDT and AVAAIUSDT history
        shell: bash
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          import csv
          import io
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          UTC = timezone.utc
          root = Path('pump_benchmark_archives')
          symbols = ['ONUSDT', 'AVAAIUSDT']
          start = date(2026, 5, 1)
          end = date(2026, 7, 21)

          def get_json(base, path, params):
              url = base + path + '?' + urllib.parse.urlencode(params)
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'scanner-benchmark/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.loads(response.read().decode('utf-8'))
                  except urllib.error.HTTPError as exc:
                      if exc.code in (400, 404):
                          return None
                      if exc.code == 429:
                          time.sleep(2 ** attempt)
                          continue
                      raise
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)
              return None

          # Exchange metadata proves symbol availability without relying on benchmark labels.
          info = get_json('https://fapi.binance.com', '/fapi/v1/exchangeInfo', {}) or {}
          selected = [row for row in info.get('symbols', []) if row.get('symbol') in symbols]
          root.mkdir(parents=True, exist_ok=True)
          (root / 'exchange_info.json').write_text(json.dumps(selected, indent=2), encoding='utf-8')

          jobs = []
          day = start
          while day <= end:
              stamp = day.isoformat()
              for symbol in symbols:
                  for market, prefix in [
                      ('futures', 'futures/um/daily/klines'),
                      ('spot', 'spot/daily/klines'),
                  ]:
                      filename = f'{symbol}-5m-{stamp}.zip'
                      url = f'https://data.binance.vision/data/{prefix}/{symbol}/5m/{filename}'
                      jobs.append((url, root / market / symbol / filename, market, symbol, day))
              day += timedelta(days=1)

          def rest_day(market, symbol, day):
              start_dt = datetime(day.year, day.month, day.day, tzinfo=UTC)
              start_ms = int(start_dt.timestamp() * 1000)
              end_ms = start_ms + 86_400_000 - 1
              if market == 'futures':
                  base, path = 'https://fapi.binance.com', '/fapi/v1/klines'
              else:
                  base, path = 'https://api.binance.com', '/api/v3/klines'
              rows = get_json(base, path, {
                  'symbol': symbol,
                  'interval': '5m',
                  'startTime': start_ms,
                  'endTime': end_ms,
                  'limit': 1500,
              })
              return rows if isinstance(rows, list) else []

          def write_zip(out, symbol, day, rows):
              out.parent.mkdir(parents=True, exist_ok=True)
              csv_name = f'{symbol}-5m-{day.isoformat()}.csv'
              buf = io.StringIO(newline='')
              writer = csv.writer(buf)
              writer.writerows(rows)
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
                  zf.writestr(csv_name, buf.getvalue())

          def fetch(job):
              url, out, market, symbol, day = job
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'scanner-benchmark/1.0'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = response.read()
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(payload)
                  return ('ARCHIVE', market, symbol, day.isoformat(), len(payload))
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      return ('ERROR', market, symbol, day.isoformat(), f'HTTP {exc.code}')
              except Exception as exc:
                  return ('ERROR', market, symbol, day.isoformat(), f'{type(exc).__name__}:{exc}')
              # Archive may not exist for the current/recent day. REST is point-in-time source fallback.
              try:
                  rows = rest_day(market, symbol, day)
                  if rows:
                      write_zip(out, symbol, day, rows)
                      return ('REST', market, symbol, day.isoformat(), len(rows))
                  return ('MISS', market, symbol, day.isoformat(), 0)
              except Exception as exc:
                  return ('ERROR', market, symbol, day.isoformat(), f'REST:{type(exc).__name__}:{exc}')

          counts = {'ARCHIVE': 0, 'REST': 0, 'MISS': 0, 'ERROR': 0}
          with ThreadPoolExecutor(max_workers=16) as executor:
              futures = [executor.submit(fetch, job) for job in jobs]
              for future in as_completed(futures):
                  result = future.result()
                  counts[result[0]] += 1
                  print(*result)

          # Download point-in-time reconstructable derivatives data.
          now_ms = int(datetime(2026, 7, 21, 23, 59, 59, tzinfo=UTC).timestamp() * 1000)
          history_start_ms = int(datetime(2026, 5, 1, tzinfo=UTC).timestamp() * 1000)
          for symbol in symbols:
              funding = []
              cursor = history_start_ms
              while cursor <= now_ms:
                  rows = get_json('https://fapi.binance.com', '/fapi/v1/fundingRate', {
                      'symbol': symbol, 'startTime': cursor, 'endTime': now_ms, 'limit': 1000,
                  }) or []
                  if not rows:
                      break
                  funding.extend(rows)
                  nxt = int(rows[-1]['fundingTime']) + 1
                  if nxt <= cursor:
                      break
                  cursor = nxt
              out = root / 'funding' / f'{symbol}.json'
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(funding), encoding='utf-8')

              oi = []
              cursor = max(history_start_ms, now_ms - 30 * 86_400_000)
              while cursor <= now_ms:
                  rows = get_json('https://fapi.binance.com', '/futures/data/openInterestHist', {
                      'symbol': symbol, 'period': '5m', 'startTime': cursor, 'endTime': now_ms, 'limit': 500,
                  }) or []
                  if not rows:
                      break
                  oi.extend(rows)
                  nxt = int(rows[-1]['timestamp']) + 300_000
                  if nxt <= cursor:
                      break
                  cursor = nxt
                  time.sleep(0.05)
              out = root / 'open_interest' / f'{symbol}.json'
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(oi), encoding='utf-8')

          (root / 'summary.json').write_text(json.dumps(counts, indent=2), encoding='utf-8')
          print('SUMMARY', counts)
          PY

      - name: Inventory
        shell: bash
        run: |
          find pump_benchmark_archives -type f -printf '%p %s bytes\n' | sort | tee pump_benchmark_inventory.txt
          du -sh pump_benchmark_archives || true

      - name: Upload benchmark archives
        uses: actions/upload-artifact@v4
        with:
          name: pump-benchmark-on-avaai
          path: |
            pump_benchmark_archives/**
            pump_benchmark_inventory.txt
          if-no-files-found: error
          retention-days: 7
