name: Benchmark archive download

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download official Binance benchmark archives
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          import urllib.request

          root = Path('benchmark_archives')
          symbols = ['AIAUSDT', 'VELVETUSDT']
          start = date(2026, 6, 1)
          end = date(2026, 7, 20)
          for symbol in symbols:
              day = start
              while day <= end:
                  stamp = day.isoformat()
                  for market, prefix in [
                      ('futures', 'futures/um/daily/klines'),
                      ('spot', 'spot/daily/klines'),
                  ]:
                      filename = f'{symbol}-5m-{stamp}.zip'
                      url = f'https://data.binance.vision/data/{prefix}/{symbol}/5m/{filename}'
                      out = root / market / symbol / filename
                      out.parent.mkdir(parents=True, exist_ok=True)
                      try:
                          with urllib.request.urlopen(url, timeout=30) as response:
                              payload = response.read()
                          out.write_bytes(payload)
                          print('OK', market, symbol, stamp, len(payload))
                      except Exception as exc:
                          print('MISS', market, symbol, stamp, type(exc).__name__, exc)
                  day += timedelta(days=1)
          PY

      - name: Inventory
        shell: bash
        run: |
          find benchmark_archives -type f -printf '%p %s bytes\n' | sort | tee benchmark_inventory.txt

      - name: Upload benchmark archives
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-archives-aia-velvet
          path: |
            benchmark_archives/**
            benchmark_inventory.txt
          if-no-files-found: warn
          retention-days: 7
