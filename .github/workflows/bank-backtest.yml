name: LISTA cutoff probe

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install aiohttp
      - name: Run LISTA point-in-time probe
        shell: bash
        run: |
          cat > /tmp/lista_probe.py <<'PY'
          import asyncio, aiohttp, json, statistics, time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          BASE='https://data-api.binance.vision'
          SYMBOL='LISTAUSDT'
          CUTOFF=int(datetime(2026,7,22,12,0,tzinfo=timezone.utc).timestamp()*1000)
          NOW=int(time.time()*1000)
          START=CUTOFF-48*3600_000

          def clamp(x,a=0,b=1): return max(a,min(b,x))
          def median(xs): return statistics.median(xs) if xs else 0.0
          def mad(xs):
              if not xs:return 0.0
              m=median(xs); return median([abs(x-m) for x in xs])
          def robust_z(x,xs):
              if len(xs)<12:return 0.0
              m=median(xs); d=mad(xs)
              return (x-m)/(1.4826*d) if d>1e-12 else 0.0
          def mean(xs): return sum(xs)/len(xs) if xs else 0.0
          def pct(a,b): return (a/b-1)*100 if b else 0.0

          async def get(session,path,params=None):
              async with session.get(BASE+path,params=params) as r:
                  txt=await r.text()
                  if r.status!=200: raise RuntimeError(f'HTTP {r.status} {txt[:200]}')
                  return json.loads(txt)

          def features(rows):
              closes=[float(r[4]) for r in rows]
              highs=[float(r[2]) for r in rows]
              lows=[float(r[3]) for r in rows]
              qv=[float(r[7]) for r in rows]
              buys=[float(r[10]) for r in rows]
              sells=[max(0,q-b) for q,b in zip(qv,buys)]
              trs=[]
              for i,r in enumerate(rows):
                  h,l=float(r[2]),float(r[3]);pc=closes[i-1] if i else float(r[1])
                  trs.append(max(h-l,abs(h-pc),abs(l-pc)))
              atr=max(1e-12,mean(trs[-24:]))
              base=median(closes[-48:])
              base_low=min(lows[-48:]);base_high=max(highs[-48:])
              dist_atr=(closes[-1]-base)/atr
              ret_1h=pct(closes[-1],closes[-13]) if len(closes)>=13 else 0
              ret_4h=pct(closes[-1],closes[-49]) if len(closes)>=49 else 0
              vol_1h=sum(qv[-12:]);vol_prev1h=sum(qv[-24:-12]);vol_4h=sum(qv[-48:]);vol_prev4h=sum(qv[-96:-48])
              hourly=[sum(qv[i:i+12]) for i in range(max(0,len(qv)-288),len(qv)-11,12)]
              vol_z=robust_z(vol_1h,hourly[:-1]) if len(hourly)>2 else 0
              acc1=vol_1h/max(1,vol_prev1h);acc4=vol_4h/max(1,vol_prev4h)
              vol_acc=clamp((acc1-1)/1.5)*.65+clamp((acc4-1)/1.0)*.35
              ratios=[b/q if q>0 else .5 for b,q in zip(buys,qv)]
              buy_ratio=sum(buys[-12:])/max(1,sum(qv[-12:]))
              persistence=sum(x>=.52 for x in ratios[-12:])/12
              consistency=1-clamp(statistics.pstdev(ratios[-12:])/.16) if len(ratios)>=12 else 0
              net=sum(2*b-q for b,q in zip(buys[-12:],qv[-12:]))/max(1,sum(qv[-12:]))
              spot_flow=clamp((buy_ratio-.48)/.12)*.35+persistence*.25+clamp((net+.08)/.25)*.20+vol_acc*.15+consistency*.05
              sell_1h=sum(sells[-12:]);sell_hours=[sum(sells[i:i+12]) for i in range(max(0,len(sells)-288),len(sells)-11,12)]
              sell_z=max(0,robust_z(sell_1h,sell_hours[:-1])) if len(sell_hours)>2 else 0
              low_1h=min(lows[-12:]);down=max(0,(closes[-13]-low_1h)/atr) if len(closes)>=13 else 0
              close_loc=(closes[-1]-min(lows[-12:]))/max(1e-12,max(highs[-12:])-min(lows[-12:]))
              recovery=(closes[-1]-low_1h)/atr
              pressure=clamp(sell_z/3)*.5+clamp(sell_1h/max(1,sum(sells[-48:])/4)-1)*.5
              ineff=1-clamp(down/max(.35,pressure*2.2))
              failed_break=1 if low_1h<base_low and closes[-1]>=base_low else 0
              absorption=clamp(pressure*.30+ineff*.30+clamp(recovery/2)*.20+close_loc*.10+failed_break*.10)
              resilience=clamp(ineff*.35+clamp(recovery/2)*.25+close_loc*.20+clamp((closes[-1]-base_low)/max(atr,base_high-base_low))*.20)
              atr_1h=mean(trs[-12:]);atr_4h=mean(trs[-48:]);compression=clamp(1-atr_1h/max(1e-12,atr_4h*1.15))
              anomaly=clamp(max(0,vol_z)/4*.35+vol_acc*.30+abs(net)*1.5*.20+compression*.15)
              upper=[]
              for r in rows[-6:]:
                  o,h,l,c=map(float,[r[1],r[2],r[3],r[4]])
                  upper.append((h-max(o,c))/max(1e-12,h-l))
              upper_wick=mean(upper)
              parabolic=clamp(max(0,ret_1h-2)/6)
              late=clamp(max(0,dist_atr-1.4)/3*.45+parabolic*.35+clamp(max(0,vol_z-4)/5)*.20)
              weak_close=1-close_loc
              flow_div=clamp((.50-buy_ratio)/.10) if ret_1h>1 else 0
              trap=clamp(upper_wick*.35+weak_close*.25+flow_div*.25+(1 if closes[-1]<base_low else 0)*.15)
              entry_q=clamp((1-late)*.45+(1-trap)*.35+clamp(1-abs(dist_atr)/2.8)*.20)
              score=clamp(.28*spot_flow+.24*absorption+.18*resilience+.14*anomaly+.10*entry_q+.06*compression-.22*late-.20*trap)
              if late>=.55: state='EXPANSION';action='DO_NOT_CHASE'
              elif trap>=.5: state='TRAP_RISK';action='NO_TRADE'
              elif score>=.58 and spot_flow>=.56 and absorption>=.52: state='PRE_IGNITION';action='WAIT_FOR_RECLAIM'
              elif absorption>=.60: state='SUPPLY_ABSORPTION';action='WATCH'
              elif score>=.46: state='EARLY_WATCH';action='WATCH'
              else: state='NORMAL';action='NO_TRADE'
              return dict(score=score,state=state,action=action,spot_flow=spot_flow,absorption=absorption,resilience=resilience,anomaly=anomaly,compression=compression,late=late,trap=trap,entry_quality=entry_q,distance_atr=dist_atr,buy_ratio=buy_ratio,vol_z=vol_z,vol_acc=vol_acc,ret_1h=ret_1h,ret_4h=ret_4h,base=base,atr=atr,price=closes[-1],pressure=pressure,sell_efficiency=1-ineff,persistence=persistence,net_flow=net)

          async def main():
              timeout=aiohttp.ClientTimeout(total=60)
              async with aiohttp.ClientSession(timeout=timeout,headers={'User-Agent':'lista-cutoff-probe'}) as s:
                  rows=await get(s,'/api/v3/klines',{'symbol':SYMBOL,'interval':'5m','startTime':START,'endTime':NOW,'limit':1000})
              pre=[r for r in rows if int(r[6])<=CUTOFF]
              post=[r for r in rows if int(r[6])>CUTOFF]
              q24=sum(float(r[7]) for r in pre if int(r[6])>CUTOFF-24*3600_000)
              decisions=[]
              begin=CUTOFF-11*3600_000
              for i,r in enumerate(pre):
                  t=int(r[6])
                  if t<begin or i<288:continue
                  f=features(pre[max(0,i-575):i+1]);f['time_ms']=t
                  decisions.append(f)
              eligible=[d for d in decisions if d['late']<.42 and d['trap']<.42]
              best=max(eligible,key=lambda x:x['score']) if eligible else max(decisions,key=lambda x:x['score'])
              latest=decisions[-1]
              cp=float(pre[-1][4])
              maxpct=pct(max(float(r[2]) for r in post),cp) if post else 0
              minpct=pct(min(float(r[3]) for r in post),cp) if post else 0
              lastpct=pct(float(post[-1][4]),cp) if post else 0
              def fmt(d):
                  x=dict(d)
                  x['time_utc']=datetime.fromtimestamp(x['time_ms']/1000,timezone.utc).isoformat()
                  x['time_vn']=datetime.fromtimestamp(x['time_ms']/1000,timezone.utc).astimezone(timezone(timedelta(hours=7))).isoformat()
                  return x
              out={'symbol':SYMBOL,'cutoff_vn':'2026-07-22T19:00:00+07:00','bars_pre':len(pre),'bars_post':len(post),'q24':q24,'cutoff_price':cp,'best':fmt(best),'latest':fmt(latest),'post_max_pct':maxpct,'post_min_pct':minpct,'post_last_pct':lastpct,'candidate_gate':best['state'] in ('EARLY_WATCH','SUPPLY_ABSORPTION','PRE_IGNITION') and best['score']>=.46}
              Path('lista_output').mkdir(exist_ok=True)
              Path('lista_output/lista_report.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
              print(json.dumps(out,indent=2))
          asyncio.run(main())
          PY
          python /tmp/lista_probe.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lista-cutoff-probe
          path: lista_output/**
          retention-days: 7
