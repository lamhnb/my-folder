name: TLM historical data download

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download official Binance TLMUSDT history
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          import json, time, urllib.error, urllib.parse, urllib.request

          UTC = timezone.utc
          root = Path('tlm_history')
          symbol = 'TLMUSDT'
          start = date(2026, 5, 15)
          end = date(2026, 7, 7)

          def request_bytes(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'pump-scanner-replay/1.3.1'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          jobs = []
          day = start
          while day <= end:
              stamp = day.isoformat()
              for market, prefix in [
                  ('futures', 'futures/um/daily/klines'),
                  ('spot', 'spot/daily/klines'),
              ]:
                  filename = f'{symbol}-5m-{stamp}.zip'
                  url = f'https://data.binance.vision/data/{prefix}/{symbol}/5m/{filename}'
                  jobs.append((url, root / market / symbol / filename, market, stamp))
              day += timedelta(days=1)

          def fetch_archive(job):
              url, out, market, stamp = job
              try:
                  payload = request_bytes(url)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(payload)
                  return ('OK', market, stamp, len(payload))
              except urllib.error.HTTPError as exc:
                  return ('MISS' if exc.code == 404 else 'ERROR', market, stamp, exc.code)
              except Exception as exc:
                  return ('ERROR', market, stamp, f'{type(exc).__name__}:{exc}')

          counts = {'OK': 0, 'MISS': 0, 'ERROR': 0}
          with ThreadPoolExecutor(max_workers=16) as executor:
              futures = [executor.submit(fetch_archive, job) for job in jobs]
              for future in as_completed(futures):
                  result = future.result()
                  counts[result[0]] += 1
                  print(*result)

          def get_json(path, params):
              url = 'https://fapi.binance.com' + path + '?' + urllib.parse.urlencode(params)
              for attempt in range(5):
                  try:
                      return json.loads(request_bytes(url).decode('utf-8'))
                  except urllib.error.HTTPError as exc:
                      if exc.code in (400, 404):
                          return []
                      if exc.code == 429:
                          time.sleep(2 ** attempt)
                          continue
                      return []
                  except Exception:
                      if attempt == 4:
                          return []
                      time.sleep(2 ** attempt)
              return []

          start_ms = int(datetime(2026, 5, 15, tzinfo=UTC).timestamp() * 1000)
          end_ms = int(datetime(2026, 7, 8, tzinfo=UTC).timestamp() * 1000) - 1

          funding = []
          cursor = start_ms
          while cursor <= end_ms:
              rows = get_json('/fapi/v1/fundingRate', {
                  'symbol': symbol, 'startTime': cursor, 'endTime': end_ms, 'limit': 1000,
              })
              if not rows:
                  break
              funding.extend(rows)
              nxt = int(rows[-1]['fundingTime']) + 1
              if nxt <= cursor:
                  break
              cursor = nxt
          (root / 'funding').mkdir(parents=True, exist_ok=True)
          (root / 'funding' / f'{symbol}.json').write_text(json.dumps(funding), encoding='utf-8')

          oi = []
          cursor = int(datetime(2026, 6, 20, tzinfo=UTC).timestamp() * 1000)
          while cursor <= end_ms:
              rows = get_json('/futures/data/openInterestHist', {
                  'symbol': symbol, 'period': '5m', 'startTime': cursor, 'endTime': end_ms, 'limit': 500,
              })
              if not rows:
                  break
              oi.extend(rows)
              nxt = int(rows[-1]['timestamp']) + 300_000
              if nxt <= cursor:
                  break
              cursor = nxt
              time.sleep(0.05)
          (root / 'open_interest').mkdir(parents=True, exist_ok=True)
          (root / 'open_interest' / f'{symbol}.json').write_text(json.dumps(oi), encoding='utf-8')

          metadata = {
              'symbol': symbol,
              'archive_counts': counts,
              'funding_rows': len(funding),
              'oi_rows': len(oi),
              'start': start.isoformat(),
              'end': end.isoformat(),
          }
          (root / 'metadata.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          print('METADATA', json.dumps(metadata))
          PY

      - name: Inventory
        if: always()
        shell: bash
        run: |
          find tlm_history -type f -printf '%p %s bytes\n' | sort | tee tlm_history_inventory.txt
          du -sh tlm_history || true

      - name: Upload TLM history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlm-history-2026-07-01
          path: |
            tlm_history/**
            tlm_history_inventory.txt
          if-no-files-found: warn
          retention-days: 7
