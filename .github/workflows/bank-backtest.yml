name: Binance current-tail probe

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe official Binance public market-data hosts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, urllib.parse, urllib.request, urllib.error
          root=Path('current_tail'); root.mkdir(exist_ok=True)
          symbols=['OPNUSDT','BANKUSDT']
          hosts={
            'spot_data':'https://data-api.binance.vision',
            'spot_api1':'https://api1.binance.com',
            'spot_api2':'https://api2.binance.com',
            'spot_api3':'https://api3.binance.com',
            'spot_api4':'https://api4.binance.com',
            'futures':'https://fapi.binance.com',
            'futures1':'https://fapi1.binance.com',
            'futures2':'https://fapi2.binance.com',
            'futures3':'https://fapi3.binance.com',
            'futures4':'https://fapi4.binance.com',
          }
          report={}
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'scanner-regression-probe/1.6'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                return r.status,r.read(),dict(r.headers)
            except urllib.error.HTTPError as e:
              return e.code,e.read(),dict(e.headers)
            except Exception as e:
              return -1,repr(e).encode(),{}
          for symbol in symbols:
            report[symbol]={}
            for name,host in hosts.items():
              if name.startswith('spot'):
                path='/api/v3/klines'; params={'symbol':symbol,'interval':'5m','limit':1000}
              else:
                path='/fapi/v1/klines'; params={'symbol':symbol,'interval':'5m','limit':1500}
              url=host+path+'?'+urllib.parse.urlencode(params)
              status,body,headers=fetch(url)
              report[symbol][name]={'status':status,'bytes':len(body),'body_prefix':body[:300].decode('utf-8','replace')}
              print(symbol,name,status,len(body),report[symbol][name]['body_prefix'][:100],flush=True)
              if status==200:
                (root/f'{symbol}-{name}.json').write_bytes(body)
          (root/'probe_report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-current-tail-probe
          path: current_tail/**
          if-no-files-found: error
          retention-days: 7
