name: Frozen holdout archive download

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download official Binance frozen holdout archives
        shell: bash
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date, timedelta
          from pathlib import Path
          import urllib.error
          import urllib.request

          root = Path('frozen_holdout_archives')
          symbols = [
              'ADAUSDT', 'AVAXUSDT', 'LINKUSDT', 'DOTUSDT', 'LTCUSDT',
              'BCHUSDT', 'TRXUSDT', 'SUIUSDT', 'APTUSDT', 'ARBUSDT',
              'OPUSDT', 'NEARUSDT', 'INJUSDT', 'SEIUSDT', 'WIFUSDT',
              'PEPEUSDT', 'BONKUSDT', 'ENAUSDT', 'CRVUSDT', 'FILUSDT',
          ]
          start = date(2026, 5, 1)
          end = date(2026, 7, 19)
          jobs = []
          day = start
          while day <= end:
              stamp = day.isoformat()
              for symbol in symbols:
                  for market, prefix in [
                      ('futures', 'futures/um/daily/klines'),
                      ('spot', 'spot/daily/klines'),
                  ]:
                      filename = f'{symbol}-5m-{stamp}.zip'
                      url = f'https://data.binance.vision/data/{prefix}/{symbol}/5m/{filename}'
                      jobs.append((url, root / market / symbol / filename, market, symbol, stamp))
              day += timedelta(days=1)

          def fetch(job):
              url, out, market, symbol, stamp = job
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = response.read()
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(payload)
                  return ('OK', market, symbol, stamp, len(payload))
              except urllib.error.HTTPError as exc:
                  return ('MISS', market, symbol, stamp, exc.code)
              except Exception as exc:
                  return ('ERROR', market, symbol, stamp, f'{type(exc).__name__}:{exc}')

          counts = {'OK': 0, 'MISS': 0, 'ERROR': 0}
          with ThreadPoolExecutor(max_workers=32) as executor:
              futures = [executor.submit(fetch, job) for job in jobs]
              for future in as_completed(futures):
                  result = future.result()
                  counts[result[0]] += 1
                  print(*result)
          print('SUMMARY', counts)
          PY

      - name: Inventory
        shell: bash
        run: |
          find frozen_holdout_archives -type f -printf '%p %s bytes\n' | sort | tee frozen_holdout_inventory.txt
          du -sh frozen_holdout_archives || true

      - name: Upload frozen holdout archives
        uses: actions/upload-artifact@v4
        with:
          name: frozen-holdout-archives
          path: |
            frozen_holdout_archives/**
            frozen_holdout_inventory.txt
          if-no-files-found: warn
          retention-days: 7
