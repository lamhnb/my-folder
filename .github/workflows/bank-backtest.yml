name: Binance Futures tail probe

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe official Futures market-data routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, urllib.parse
          root=Path('futures_tail'); root.mkdir(exist_ok=True)
          symbols=['OPNUSDT','BANKUSDT']
          routes=[]
          for host in [
            'https://data-api.binance.vision',
            'https://fapi.binance.com',
            'https://fapi1.binance.com',
            'https://fapi2.binance.com',
            'https://fapi3.binance.com',
            'https://fapi4.binance.com',
          ]:
            for path in ['/fapi/v1/klines','/fapi/v1/continuousKlines']:
              routes.append((host,path))
          report={}
          for symbol in symbols:
            report[symbol]={}
            for host,path in routes:
              params={'interval':'5m','limit':'1500'}
              if path.endswith('continuousKlines'):
                params.update({'pair':symbol.replace('USDT','USDT'),'contractType':'PERPETUAL'})
              else:
                params['symbol']=symbol
              url=host+path+'?'+urllib.parse.urlencode(params)
              key=(host.replace('https://','')+path).replace('/','_')
              proc=subprocess.run([
                'curl','-sS','-L','--compressed','--connect-timeout','15','--max-time','45',
                '-H','Accept: application/json','-H','User-Agent: Mozilla/5.0',
                '-w','\n__STATUS__:%{http_code}',url
              ],capture_output=True)
              payload=proc.stdout
              marker=b'\n__STATUS__:'
              body,status=(payload.rsplit(marker,1)+[b''])[:2] if marker in payload else (payload,b'')
              try: status_int=int(status.decode().strip())
              except: status_int=-1
              report[symbol][key]={'status':status_int,'bytes':len(body),'prefix':body[:500].decode('utf-8','replace'),'stderr':proc.stderr.decode('utf-8','replace')[:300]}
              print(symbol,key,status_int,len(body),report[symbol][key]['prefix'][:120],flush=True)
              if status_int==200 and body.lstrip().startswith(b'['):
                (root/f'{symbol}-{key}.json').write_bytes(body)
          (root/'probe_report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-futures-tail-probe
          path: futures_tail/**
          if-no-files-found: error
          retention-days: 7
