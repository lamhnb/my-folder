name: Champion-X Anti-Crowd Geometry
on:
  push:
    branches:
      - research/power655-champion-x-input-sensitivity-20261025
    paths:
      - vietlott-power655-research/challengers/champion_x_anticrowd_geometry_20261103.py
      - .github/workflows/champion-x-anticrowd-geometry.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare geometry against birthday baseline on later years
        run: python vietlott-power655-research/challengers/champion_x_anticrowd_geometry_20261103.py
      - name: Upload research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-x-anticrowd-geometry
          path: vietlott-power655-research/challengers/anticrowd_geometry_outputs/
          if-no-files-found: warn
