name: Champion-X Sixth-Number Identifiability
on:
  push:
    branches:
      - research/power655-champion-x-input-sensitivity-20261025
    paths:
      - vietlott-power655-research/challengers/champion_x_j2_sixth_number_identifiability_20261103.py
      - .github/workflows/champion-x-j2-identifiability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit jackpot2 versus first-prize subgroup
        run: python vietlott-power655-research/challengers/champion_x_j2_sixth_number_identifiability_20261103.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-x-j2-sixth-identifiability
          path: vietlott-power655-research/challengers/j2_sixth_number_outputs/
          if-no-files-found: warn
