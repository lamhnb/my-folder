name: V18 exact live dry run

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct exact V1.8 package
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scanner_validation/v18_live_minimal.part00.b64 \
            scanner_validation/v18_live_minimal.part01a.b64 \
            scanner_validation/v18_live_minimal.part01b.b64 \
            scanner_validation/v18_live_minimal.part02.b64 \
            scanner_validation/v18_live_minimal.part03.b64 \
            scanner_validation/v18_live_minimal.part04.b64 \
            | tr -d '\n\r' | base64 --decode > /tmp/v18_live_minimal.zip
          echo 'b51d034496d1f7e14bbf360ecb16f6d8abc1985fa1b5fdaa642f5e48930eba7b  /tmp/v18_live_minimal.zip' | sha256sum -c -
          unzip -q /tmp/v18_live_minimal.zip -d /tmp
          cd /tmp/v18_live_minimal
          python -m compileall -q scanner tools/live_dry_run.py
      - name: Install exact runtime requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/v18_live_minimal/requirements.txt
      - name: Select accessible official Binance market-data endpoints
        shell: bash
        run: |
          set +e
          cd /tmp/v18_live_minimal
          mkdir -p reports/live_scan_20260723
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path
          import yaml

          spot_candidates = [
              'https://data-api.binance.vision',
              'https://api-gcp.binance.com',
              'https://api1.binance.com',
              'https://api2.binance.com',
              'https://api3.binance.com',
              'https://api4.binance.com',
              'https://api.binance.com',
          ]
          futures_candidates = [
              'https://fapi1.binance.com',
              'https://fapi2.binance.com',
              'https://fapi3.binance.com',
              'https://fapi4.binance.com',
              'https://fapi.binance.com',
              'https://data-api.binance.vision',
          ]

          def probe(base, path):
              url = base + path
              request = urllib.request.Request(url, headers={'User-Agent': 'v18-live-endpoint-probe/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      raw = response.read(512)
                      return {'base': base, 'url': url, 'status': response.status, 'ok': response.status == 200, 'sample': raw.decode('utf-8', 'replace')[:200]}
              except urllib.error.HTTPError as exc:
                  return {'base': base, 'url': url, 'status': exc.code, 'ok': False, 'error': str(exc)}
              except Exception as exc:
                  return {'base': base, 'url': url, 'status': None, 'ok': False, 'error': f'{type(exc).__name__}: {exc}'}

          spot_results = [probe(base, '/api/v3/time') for base in spot_candidates]
          futures_results = [probe(base, '/fapi/v1/time') for base in futures_candidates]
          spot_base = next((row['base'] for row in spot_results if row['ok']), None)
          futures_base = next((row['base'] for row in futures_results if row['ok']), None)
          report = {
              'spot_results': spot_results,
              'futures_results': futures_results,
              'selected_spot_base': spot_base,
              'selected_futures_base': futures_base,
          }
          Path('reports/live_scan_20260723/endpoint_probe.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          if spot_base and futures_base:
              config_path = Path('config.yaml')
              config = yaml.safe_load(config_path.read_text(encoding='utf-8'))
              config['binance']['spot_rest_base'] = spot_base
              config['binance']['futures_rest_base'] = futures_base
              config_path.write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
              print(json.dumps({'selected_spot_base': spot_base, 'selected_futures_base': futures_base}, indent=2))
          else:
              print(json.dumps(report, indent=2))
          PY
      - name: Run exact V1.8 full-universe live dry run
        shell: bash
        run: |
          set +e
          cd /tmp/v18_live_minimal
          mkdir -p reports/live_scan_20260723
          date -u +'%Y-%m-%dT%H:%M:%SZ' > reports/live_scan_20260723/workflow_started_utc.txt
          TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%dT%H:%M:%S%z' > reports/live_scan_20260723/workflow_started_vn.txt
          printf '%s\n' '${{ github.sha }}' > reports/live_scan_20260723/github_sha.txt
          sha256sum config.yaml tools/live_dry_run.py > reports/live_scan_20260723/source_hashes.sha256
          python tools/live_dry_run.py --config config.yaml --out reports/live_scan_20260723 --limit 0 --concurrency 6 2>&1 | tee reports/live_scan_20260723/live_dry_run.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > reports/live_scan_20260723/process_exit_code.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > reports/live_scan_20260723/workflow_finished_utc.txt
          TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%dT%H:%M:%S%z' > reports/live_scan_20260723/workflow_finished_vn.txt
          exit 0
      - name: Upload frozen V1.8 live scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-exact-live-scan-20260723
          path: /tmp/v18_live_minimal/reports/live_scan_20260723/**
          retention-days: 14
          compression-level: 6
