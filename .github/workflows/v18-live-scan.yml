name: V18 exact live dry run

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Reconstruct exact V1.8 package
        shell: bash
        run: |
          set -euo pipefail
          cat scanner_validation/v18_live_minimal.part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/v18_live_minimal.zip
          echo 'b51d034496d1f7e14bbf360ecb16f6d8abc1985fa1b5fdaa642f5e48930eba7b  /tmp/v18_live_minimal.zip' | sha256sum -c -
          unzip -q /tmp/v18_live_minimal.zip -d /tmp
          cd /tmp/v18_live_minimal
          python -m compileall -q scanner tools/live_dry_run.py
      - name: Install exact runtime requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/v18_live_minimal/requirements.txt
      - name: Run exact V1.8 full-universe live dry run
        shell: bash
        run: |
          set +e
          cd /tmp/v18_live_minimal
          mkdir -p reports/live_scan_20260723
          date -u +'%Y-%m-%dT%H:%M:%SZ' > reports/live_scan_20260723/workflow_started_utc.txt
          TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%dT%H:%M:%S%z' > reports/live_scan_20260723/workflow_started_vn.txt
          printf '%s\n' '${{ github.sha }}' > reports/live_scan_20260723/github_sha.txt
          sha256sum config.yaml tools/live_dry_run.py > reports/live_scan_20260723/source_hashes.sha256
          python tools/live_dry_run.py --config config.yaml --out reports/live_scan_20260723 --limit 0 --concurrency 6 2>&1 | tee reports/live_scan_20260723/live_dry_run.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > reports/live_scan_20260723/process_exit_code.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > reports/live_scan_20260723/workflow_finished_utc.txt
          TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%dT%H:%M:%S%z' > reports/live_scan_20260723/workflow_finished_vn.txt
          exit 0
      - name: Upload frozen V1.8 live scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-exact-live-scan-20260723
          path: /tmp/v18_live_minimal/reports/live_scan_20260723/**
          retention-days: 14
          compression-level: 6
