name: V110 cutoff 24 July official data

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official Binance archives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          import json, time, urllib.error, urllib.request, zipfile

          symbols=[x.strip() for x in Path('scanner_validation/universe_20260719_spotproxy.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          root=Path('v110_cutoff24_raw'); root.mkdir(parents=True,exist_ok=True)
          replay_dates=['2026-07-20','2026-07-21','2026-07-22','2026-07-23']
          outcome_date='2026-07-24'

          def spec(symbol,kind,stamp):
              esc=quote(symbol,safe='')
              if kind=='futures_klines':
                  name=f'{symbol}-5m-{stamp}.zip'; return f'https://data.binance.vision/data/futures/um/daily/klines/{esc}/5m/{quote(name,safe="-._")}',name
              if kind=='spot_klines':
                  name=f'{symbol}-5m-{stamp}.zip'; return f'https://data.binance.vision/data/spot/daily/klines/{esc}/5m/{quote(name,safe="-._")}',name
              name=f'{symbol}-metrics-{stamp}.zip'; return f'https://data.binance.vision/data/futures/um/daily/metrics/{esc}/{quote(name,safe="-._")}',name

          def fetch(job):
              symbol,kind,stamp=job; url,name=spec(symbol,kind,stamp); out=root/symbol/kind/name; error='UNKNOWN'; delay=.5
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'v110-cutoff24-data'})
                      with urllib.request.urlopen(req,timeout=40) as r:data=r.read()
                      out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
                      with zipfile.ZipFile(out) as z:
                          bad=z.testzip()
                          if bad: raise RuntimeError(f'bad zip member {bad}')
                      return {'status':'OK','symbol':symbol,'kind':kind,'date':stamp,'bytes':len(data)}
                  except urllib.error.HTTPError as e:
                      if e.code==404:return {'status':'MISS','symbol':symbol,'kind':kind,'date':stamp,'error':'404'}
                      error=f'HTTP {e.code}'
                  except Exception as e:error=f'{type(e).__name__}: {e}'
                  if attempt<3:time.sleep(delay);delay=min(6,delay*2)
              return {'status':'ERROR','symbol':symbol,'kind':kind,'date':stamp,'error':error}

          jobs=[]
          for s in symbols:
              for d in replay_dates: jobs.extend((s,k,d) for k in ('futures_klines','spot_klines','futures_metrics'))
              jobs.append((s,'futures_klines',outcome_date))
          results=[]
          with ThreadPoolExecutor(max_workers=32) as pool:
              fs=[pool.submit(fetch,j) for j in jobs]
              for i,f in enumerate(as_completed(fs),1):
                  results.append(f.result())
                  if i%250==0:print(f'[DOWNLOAD] {i}/{len(fs)}',flush=True)
          universe=[]
          for s in symbols:
              if not (root/s/'futures_klines'/f'{s}-5m-2026-07-23.zip').exists():continue
              universe.append(s); rest=root/s/'rest';rest.mkdir(parents=True,exist_ok=True)
              for name in ('funding.json','open_interest_5m.json','global_long_short_5m.json','taker_long_short_5m.json','top_account_long_short_5m.json','top_position_long_short_5m.json'):(rest/name).write_text('[]',encoding='utf-8')
              (root/s/'metadata.json').write_text(json.dumps({'source':'Binance Data Vision official daily archives','replay_dates':replay_dates,'outcome_date':outcome_date,'cutoff_utc':'2026-07-23T17:00:00+00:00'},indent=2),encoding='utf-8')
          (root/'historical_futures_universe.txt').write_text('\n'.join(universe)+'\n',encoding='utf-8')
          counts={}
          for r in results:
              key=f"{r['kind']}:{r['status']}";counts[key]=counts.get(key,0)+1
          summary={'input_symbols':len(symbols),'historical_futures_symbols':len(universe),'replay_dates':replay_dates,'outcome_date':outcome_date,'counts':counts}
          (root/'download_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          (root/'download_results.json').write_text(json.dumps(results),encoding='utf-8')
          print(json.dumps(summary,indent=2),flush=True)
          PY
      - name: Inventory
        run: |
          find v110_cutoff24_raw -type f | wc -l
          du -sh v110_cutoff24_raw
          cat v110_cutoff24_raw/download_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: v110-cutoff24-official-data
          path: v110_cutoff24_raw/**
          retention-days: 7
          compression-level: 0
