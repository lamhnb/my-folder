name: Champion-X J2 Three-Group Validation
on:
  push:
    branches:
      - research/power655-champion-x-input-sensitivity-20261025
    paths:
      - vietlott-power655-research/challengers/champion_x_j2_three_group_20261103.py
      - .github/workflows/champion-x-j2-three-group.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run three-band sixth-number holdout study
        run: python vietlott-power655-research/challengers/champion_x_j2_three_group_20261103.py
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-x-j2-three-group
          path: vietlott-power655-research/challengers/j2_sixth_group_outputs/
          if-no-files-found: warn
