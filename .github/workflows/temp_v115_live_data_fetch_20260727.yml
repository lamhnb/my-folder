name: Temporary V1.15 Primit OpenAPI fetch

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Primit OpenAPI schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          url='https://api.pipai.org/openapi.json'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 V1.15-openapi'})
          with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read()
          Path('artifact/openapi.json').write_bytes(raw)
          schema=json.loads(raw)
          paths=sorted(schema.get('paths',{}))
          Path('artifact/paths.txt').write_text('\n'.join(paths)+'\n',encoding='utf-8')
          print(json.dumps({'title':schema.get('info',{}).get('title'),'version':schema.get('info',{}).get('version'),'path_count':len(paths),'kline_paths':[p for p in paths if 'kline' in p.lower() or 'candle' in p.lower()],'ticker_paths':[p for p in paths if 'ticker' in p.lower()]},indent=2))
          PY
      - name: Upload schema
        uses: actions/upload-artifact@v4
        with:
          name: v115-primit-openapi-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
