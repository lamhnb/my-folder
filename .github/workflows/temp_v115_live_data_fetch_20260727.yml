name: Temporary V1.15 current gateway probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe futures gateway and official spot market-data API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import asyncio, json, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT=Path('artifact')
          specs=[
            ('f_exchange','https://api.pipai.org/exchangeInfo',{}),
            ('f_tickers','https://api.pipai.org/ticker/24hr',{}),
            ('f_klines','https://api.pipai.org/klines',{'symbol':'BTCUSDT','interval':'5m','limit':20}),
            ('f_depth','https://api.pipai.org/depth',{'symbol':'BTCUSDT','limit':20}),
            ('f_premium','https://api.pipai.org/premiumIndex',{'symbol':'BTCUSDT'}),
            ('f_oi','https://api.pipai.org/openInterestHist',{'symbol':'BTCUSDT','period':'5m','limit':20}),
            ('s_exchange','https://data-api.binance.vision/api/v3/exchangeInfo',{}),
            ('s_tickers','https://data-api.binance.vision/api/v3/ticker/24hr',{}),
            ('s_klines','https://data-api.binance.vision/api/v3/klines',{'symbol':'BTCUSDT','interval':'5m','limit':20}),
            ('s_depth','https://data-api.binance.vision/api/v3/depth',{'symbol':'BTCUSDT','limit':20}),
          ]

          def fetch(name,base,params):
            url=base+('?' + urllib.parse.urlencode(params) if params else '')
            started=time.monotonic(); item={'name':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 V1.15-current-probe','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                raw=r.read(); item.update(status=r.status,elapsed_seconds=round(time.monotonic()-started,3),bytes=len(raw))
                parsed=json.loads(raw.decode('utf-8')); item['type']=type(parsed).__name__; item['length']=len(parsed) if hasattr(parsed,'__len__') else None
                if isinstance(parsed,list): item['sample']=parsed[:1]
                elif isinstance(parsed,dict): item['keys']=list(parsed)[:30]; item['sample']={k:parsed[k] for k in list(parsed)[:5]}
            except Exception as exc:
              item['elapsed_seconds']=round(time.monotonic()-started,3); item['error']=f'{type(exc).__name__}: {exc}'
            return item

          async def main():
            return await asyncio.gather(*(asyncio.to_thread(fetch,*spec) for spec in specs))

          results=asyncio.run(main())
          for item in results: print(json.dumps(item,ensure_ascii=False),flush=True)
          ROOT.joinpath('probe.json').write_text(json.dumps({'completed_at_utc':datetime.now(timezone.utc).isoformat(),'results':results},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-current-gateway-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
