name: Temporary V1.15 current full-universe prefilter and deep data capture

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Capture current V1.15 scan inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/symbols
          python3 -m pip install --quiet --upgrade --no-cache-dir \
            git+https://github.com/rongardF/tvdatafeed.git \
            'websockets>=14,<16' pandas
          python3 - <<'PY'
          from __future__ import annotations
          import asyncio, concurrent.futures, csv, gzip, hashlib, json, math, threading, time
          import urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any
          import pandas as pd
          import websockets
          from tvDatafeed import TvDatafeed, Interval

          OUT=Path('artifact'); SD=OUT/'symbols'; SD.mkdir(parents=True,exist_ok=True)
          DEEP_LIMIT=140; MAX_WORKERS=6
          KNOWN={'AVAAIUSDT','ZAMAUSDT','EULUSDT','BANKUSDT','DIAUSDT','PRLUSDT','SAPIENUSDT','MMTUSDT','OPENUSDT','INJUSDT','SYNUSDT','PARTIUSDT','EIGENUSDT','NEOUSDT'}
          errors=[]; lock=threading.Lock()

          def fnum(v,d=0.0):
            try:
              x=float(v); return x if math.isfinite(x) else d
            except Exception: return d

          def get_json(url, attempts=4):
            delay=1.0; last=None
            for i in range(attempts):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 V1.15-current-scan','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=60) as r: return json.loads(r.read().decode())
              except Exception as exc:
                last=exc
                if i+1<attempts: time.sleep(delay); delay*=2
            raise last

          async def first(url):
            async with websockets.connect(url,open_timeout=20,close_timeout=5,max_size=64_000_000,ping_interval=20,ping_timeout=20) as ws:
              return json.loads(await asyncio.wait_for(ws.recv(),timeout=40))

          async def market_state():
            return await asyncio.gather(
              first('wss://fstream.binance.com/market/ws/!ticker@arr'),
              first('wss://fstream.binance.com/market/ws/!markPrice@arr@1s'))

          tickers_raw, marks_raw=asyncio.run(market_state())
          captured_ms=int(time.time()*1000)
          tickers={r.get('s'):r for r in tickers_raw if isinstance(r,dict) and str(r.get('s','')).endswith('USDT')}
          marks={r.get('s'):r for r in marks_raw if isinstance(r,dict) and str(r.get('s','')).endswith('USDT')}
          universe=sorted(tickers)

          spot_info=get_json('https://data-api.binance.vision/api/v3/exchangeInfo')
          spot_set={r.get('symbol') for r in spot_info.get('symbols',[]) if r.get('status')=='TRADING' and r.get('quoteAsset')=='USDT'}
          spot_ticker_rows=get_json('https://data-api.binance.vision/api/v3/ticker/24hr')
          spot_tickers={r.get('symbol'):r for r in spot_ticker_rows if isinstance(r,dict) and r.get('symbol') in spot_set}

          def qv(s): return fnum(tickers[s].get('q'))
          def ch(s): return fnum(tickers[s].get('P'))
          def rg(s):
            r=tickers[s]; o=fnum(r.get('o')); return (fnum(r.get('h'))-fnum(r.get('l')))/o*100 if o>0 else 0
          by_v=sorted(universe,key=qv,reverse=True); by_g=sorted(universe,key=ch,reverse=True); by_l=sorted(universe,key=ch); by_r=sorted(universe,key=rg,reverse=True)
          pools=[by_v[:95],by_g[:30],by_l[:30],by_r[:30],sorted(KNOWN & set(universe))]
          union=set().union(*map(set,pools))
          ranks=[{s:i for i,s in enumerate(x)} for x in (by_v,by_g,by_l,by_r)]
          def priority(s): return (0 if s in KNOWN else 1,-sum(s in p for p in pools[:4]),min(x.get(s,9999) for x in ranks),ranks[0].get(s,9999),s)
          selected=sorted(union,key=priority)[:DEEP_LIMIT]
          for s in sorted(KNOWN & set(universe)):
            if s not in selected:
              selected.append(s)
          selected=sorted(set(selected),key=priority)[:DEEP_LIMIT]

          rows=[]
          for s in universe:
            t=tickers[s]
            rows.append({'symbol':s,'last_price':t.get('c'),'change_24h_pct':t.get('P'),'quote_volume_24h':t.get('q'),'high_24h':t.get('h'),'low_24h':t.get('l'),'range_24h_pct':rg(s),'deep_selected':int(s in selected),'has_binance_spot':int(s in spot_set),'known_case':int(s in KNOWN)})
          with (OUT/'full_universe_prefilter.csv').open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)

          def ms(index):
            x=pd.Timestamp(index); x=x.tz_localize('UTC') if x.tzinfo is None else x.tz_convert('UTC'); return int(x.timestamp()*1000)
          def price_rows(df):
            out=[]
            for idx,r in df.iterrows():
              vals=[fnum(r.get(k),float('nan')) for k in ('open','high','low','close','volume')]
              if not all(math.isfinite(x) for x in vals): continue
              o,h,l,c,v=vals; q=max(0,((o+h+l+c)/4)*v); t=ms(idx)
              out.append([t,str(o),str(h),str(l),str(c),str(v),t+299999,str(q),0,str(v*.5),str(q*.5),'0'])
            return out
          def oi_rows(df):
            if df is None: return []
            out=[]
            for idx,r in df.iterrows():
              v=fnum(r.get('close'),float('nan'))
              if math.isfinite(v): out.append({'timestamp':ms(idx),'sumOpenInterest':str(v)})
            return out
          def spot_rows(s):
            if s not in spot_set: return []
            q=urllib.parse.urlencode({'symbol':s,'interval':'5m','limit':1000})
            return get_json('https://data-api.binance.vision/api/v3/klines?'+q)

          def fetch_one(s):
            start=time.time(); result={'symbol':s,'ok':False}
            try:
              tv=TvDatafeed()
              pdf=tv.get_hist(symbol=f'{s}.P',exchange='BINANCE',interval=Interval.in_5_minute,n_bars=1000,extended_session=False)
              if pdf is None or len(pdf)<60: raise RuntimeError(f'price bars={0 if pdf is None else len(pdf)}')
              try: odf=tv.get_hist(symbol=f'{s}.P_OI',exchange='BINANCE',interval=Interval.in_5_minute,n_bars=1000,extended_session=False)
              except Exception as exc:
                odf=None
                with lock: errors.append({'symbol':s,'source':'tv_oi','error':f'{type(exc).__name__}: {exc}'})
              try: srows=spot_rows(s)
              except Exception as exc:
                srows=[]
                with lock: errors.append({'symbol':s,'source':'spot','error':f'{type(exc).__name__}: {exc}'})
              frows=price_rows(pdf); orows=oi_rows(odf); t=tickers[s]; st=spot_tickers.get(s,{}); m=marks.get(s,{})
              payload={'symbol':s,'futures_5m':frows,'spot_5m':srows,'oi_5m':orows,'premium_index':{'symbol':s,'markPrice':m.get('p'),'indexPrice':m.get('i'),'lastFundingRate':m.get('r'),'nextFundingTime':m.get('T')},'depth_100':{},'futures_24h':{'symbol':s,'lastPrice':t.get('c'),'priceChangePercent':t.get('P'),'quoteVolume':t.get('q'),'volume':t.get('v'),'highPrice':t.get('h'),'lowPrice':t.get('l'),'openPrice':t.get('o')},'spot_24h':st,'has_binance_spot':bool(srows),'futures_taker_flow_mode':'NEUTRAL_IMPUTED_0_5_FROM_TRADINGVIEW_OHLCV','fetched_at_ms':int(time.time()*1000),'sources':{'futures_ohlcv':'TradingView BINANCE:<symbol>.P','open_interest':'TradingView BINANCE:<symbol>.P_OI','spot_ohlcv':'Binance data-api','ticker_mark':'Binance Futures WebSocket'}}
              with gzip.open(SD/f'{s}.json.gz','wt',encoding='utf-8') as f: json.dump(payload,f,separators=(',',':'),ensure_ascii=False)
              result.update({'ok':True,'seconds':round(time.time()-start,2),'futures_bars':len(frows),'oi_points':len(orows),'spot_bars':len(srows),'latest_ms':frows[-1][6]})
            except Exception as exc:
              result.update({'error':f'{type(exc).__name__}: {exc}','seconds':round(time.time()-start,2)})
              with lock: errors.append({'symbol':s,'source':'deep','error':result['error']})
            return result

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
            jobs={pool.submit(fetch_one,s):s for s in selected}
            for i,job in enumerate(concurrent.futures.as_completed(jobs),1):
              results.append(job.result())
              if i%10==0 or i==len(jobs): print(f'[CAPTURE] {i}/{len(jobs)}',flush=True)

          success=sorted(r['symbol'] for r in results if r.get('ok')); failed=sorted(r['symbol'] for r in results if not r.get('ok'))
          meta={'status':'COMPLETED' if success else 'FAILED','captured_at_utc':datetime.fromtimestamp(captured_ms/1000,tz=timezone.utc).isoformat(),'completed_at_utc':datetime.now(timezone.utc).isoformat(),'full_futures_universe_count':len(universe),'deep_requested_count':len(selected),'deep_success_count':len(success),'deep_failed_count':len(failed),'deep_symbols':selected,'success_symbols':success,'failed_symbols':failed,'known_present':sorted(KNOWN & set(universe)),'known_missing':sorted(KNOWN-set(universe)),'depth_status':'NOT_CAPTURED_IN_STAGE_1','futures_taker_flow_mode':'NEUTRAL_IMPUTED_0_5_FROM_TRADINGVIEW_OHLCV','deep_results':sorted(results,key=lambda x:x['symbol']),'errors':errors,'notes':['Full-universe prefilter is current Binance Futures ticker stream.','Deep historical futures OHLCV/OI use TradingView Binance relay.','Historical Futures taker-buy is neutral-imputed; flow confidence is degraded.','Spot OHLCV is official Binance market-data-only.','Phase/lineage remains shadow-only.']}
          (OUT/'meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')
          hashes=[]
          for p in sorted(OUT.rglob('*')):
            if p.is_file() and p.name!='SHA256SUMS.txt': hashes.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(OUT)}')
          (OUT/'SHA256SUMS.txt').write_text('\n'.join(hashes)+'\n',encoding='utf-8')
          print(json.dumps({'universe':len(universe),'requested':len(selected),'success':len(success),'failed':len(failed),'errors':len(errors)},indent=2))
          if len(success)<60: raise SystemExit(f'Insufficient deep coverage: {len(success)}')
          PY
      - name: Upload current scan inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-current-scan-inputs-20260727
          path: artifact
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
