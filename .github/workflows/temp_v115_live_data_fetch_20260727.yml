name: Temporary Tokyo Binance kline proxy probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe public read-only Tokyo Binance kline endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import concurrent.futures, json, ssl, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base='https://52.69.48.142.nip.io/api/debug/scalper-msandwich-paper'
          symbols=['BTCUSDT','DIAUSDT','EULUSDT','PRLUSDT','BANKUSDT','ZAMAUSDT']
          tests=[]
          for symbol in symbols:
            q=urllib.parse.urlencode({'symbol':symbol,'interval':'5m','limit':1000,'capital':18,'leverage':30})
            tests.append((symbol,base+'?'+q))
          ctx=ssl._create_unverified_context()

          def probe(item):
            symbol,url=item
            started=time.time()
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 V1.15-current-scan','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=120,context=ctx) as r:
                body=r.read()
                text=body.decode('utf-8',errors='replace')
                parsed=None
                try: parsed=json.loads(text)
                except Exception: pass
                Path(f'artifact/{symbol}.response').write_bytes(body)
                summary={'symbol':symbol,'url':url,'ok':True,'status':getattr(r,'status',None),'elapsed':round(time.time()-started,3),'bytes':len(body),'content_type':r.headers.get('Content-Type'),'head':text[:1500],'json_type':type(parsed).__name__ if parsed is not None else None}
                if isinstance(parsed,dict):
                  summary['keys']=sorted(parsed.keys())
                  for k,v in parsed.items():
                    if isinstance(v,list): summary[f'{k}_len']=len(v)
                    elif isinstance(v,dict): summary[f'{k}_keys']=sorted(v.keys())[:100]
                return summary
            except Exception as exc:
              return {'symbol':symbol,'url':url,'ok':False,'elapsed':round(time.time()-started,3),'error':f'{type(exc).__name__}: {exc}'}

          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            results=list(pool.map(probe,tests))
          report={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'results':results}
          Path('artifact/tokyo_probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload Tokyo probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-tokyo-kline-proxy-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
