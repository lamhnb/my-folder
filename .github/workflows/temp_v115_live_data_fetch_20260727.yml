name: Temporary V1.15 futures proxy probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe futures historical market-data proxy routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import concurrent.futures, json, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          target = 'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'
          encoded = urllib.parse.quote(target, safe='')
          tests = [
            ('jina_https', 'https://r.jina.ai/https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'),
            ('jina_http', 'https://r.jina.ai/http://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'),
            ('codetabs', 'https://api.codetabs.com/v1/proxy?quest=' + encoded),
            ('isomorphic_git', 'https://cors.isomorphic-git.org/' + target),
            ('corsproxy_org', 'https://corsproxy.org/?' + encoded),
            ('cors_eu', 'https://cors.eu.org/' + target),
            ('yacdn', 'https://yacdn.org/proxy/' + target),
            ('thingproxy', 'https://thingproxy.freeboard.io/fetch/' + target),
            ('allorigins_get', 'https://api.allorigins.win/get?url=' + encoded),
            ('allorigins_raw', 'https://api.allorigins.win/raw?url=' + encoded),
            ('corsproxy_io', 'https://corsproxy.io/?url=' + encoded),
            ('cors_lol', 'https://api.cors.lol/?url=' + encoded),
            ('cors_sh', 'https://proxy.cors.sh/' + target),
            ('cloudflare_worker_demo', 'https://test.cors.workers.dev/?' + target),
            ('binance_info', 'https://www.binance.info/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'),
            ('binance_me', 'https://www.binance.me/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'),
            ('binance_cloud', 'https://www.binance.cloud/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'),
            ('binance_no_www', 'https://binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'),
            ('api1_futures_path', 'https://api1.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'),
            ('api4_futures_path', 'https://api4.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=5'),
          ]

          def probe(item):
            name, url = item
            start=time.time()
            try:
              headers={'User-Agent':'Mozilla/5.0 V1.15-proxy-probe','Accept':'application/json','x-no-cache':'true'}
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                body=r.read()
                text=body.decode('utf-8',errors='replace')
                parsed=None
                try: parsed=json.loads(text)
                except Exception: pass
                # allorigins get wraps content
                inner=None
                if isinstance(parsed,dict) and isinstance(parsed.get('contents'),str):
                  try: inner=json.loads(parsed['contents'])
                  except Exception: pass
                return {'name':name,'url':url,'ok':True,'status':getattr(r,'status',None),'elapsed':round(time.time()-start,3),'bytes':len(body),'head':text[:500],'json_type':type(parsed).__name__ if parsed is not None else None,'inner_type':type(inner).__name__ if inner is not None else None}
            except Exception as exc:
              return {'name':name,'url':url,'ok':False,'elapsed':round(time.time()-start,3),'error':f'{type(exc).__name__}: {exc}'}

          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as pool:
            results=list(pool.map(probe,tests))
          report={'completed_at_utc':datetime.now(timezone.utc).isoformat(),'target':target,'results':results}
          Path('artifact/futures_proxy_probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload proxy probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-futures-proxy-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
