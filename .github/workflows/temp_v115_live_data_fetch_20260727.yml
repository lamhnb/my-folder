name: Temporary TradingView endpoint probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe TradingView data websocket endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact tvprobe
          cd tvprobe
          npm init -y >/dev/null 2>&1
          npm install --silent tvws ws
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { connect, getCandles } from 'tvws';
          import WebSocket from 'ws';

          const report={checked_at_utc:new Date().toISOString(), endpoints:[]};
          for (const endpoint of ['data','prodata','widgetdata','charts-polygon']) {
            const row={endpoint};
            let connection;
            const start=Date.now();
            try {
              connection=await connect({endpoint});
              row.connected=true; row.connect_ms=Date.now()-start;
              const result=await getCandles({connection,symbols:['BINANCE:BTCUSDT.P'],amount:20,timeframe:'5'});
              row.result_type=Array.isArray(result)?'array':typeof result;
              row.count=Array.isArray(result)?result.length:null;
              row.sample=Array.isArray(result)?result.slice(-2):result;
              fs.writeFileSync(`../artifact/${endpoint}.json`,JSON.stringify(result));
            } catch(error) {
              row.connected=false; row.elapsed_ms=Date.now()-start; row.error=`${error?.name||'Error'}: ${error?.message||error}`;
            } finally { try {await connection?.close();} catch{} }
            report.endpoints.push(row);
          }

          const rawUrls=[
            'wss://data.tradingview.com/socket.io/websocket',
            'wss://prodata.tradingview.com/socket.io/websocket',
            'wss://widgetdata.tradingview.com/socket.io/websocket',
            'wss://charts-polygon.tradingview.com/socket.io/websocket',
          ];
          report.raw=[];
          for (const url of rawUrls) {
            const row={url};
            await new Promise((resolve)=>{
              const ws=new WebSocket(url,{headers:{Origin:'https://www.tradingview.com','User-Agent':'Mozilla/5.0'}});
              const timer=setTimeout(()=>{row.error='timeout';try{ws.terminate();}catch{};resolve();},15000);
              ws.on('open',()=>{row.open=true;clearTimeout(timer);try{ws.close();}catch{};resolve();});
              ws.on('unexpected-response',(req,res)=>{row.status=res.statusCode;row.headers=res.headers;clearTimeout(timer);resolve();});
              ws.on('error',(e)=>{row.error=`${e.name}: ${e.message}`;clearTimeout(timer);resolve();});
            });
            report.raw.push(row);
          }
          fs.writeFileSync('../artifact/tv_endpoint_probe.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS
      - name: Upload TradingView endpoint probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-tradingview-endpoint-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
