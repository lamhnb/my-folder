name: Temporary tvDatafeed Binance futures probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Probe Binance perpetual and OI through TradingView protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 -m pip install --quiet --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git
          python3 - <<'PY'
          import json, time
          from datetime import datetime, timezone
          from pathlib import Path
          from tvDatafeed import TvDatafeed, Interval

          tv=TvDatafeed()
          symbols=['BTCUSDT','DIAUSDT','EULUSDT','PRLUSDT','BANKUSDT','ZAMAUSDT']
          report={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'results':[]}
          for symbol in symbols:
            row={'symbol':symbol}
            for kind,ticker in [('price',f'{symbol}.P'),('oi',f'{symbol}.P_OI')]:
              start=time.time()
              try:
                df=tv.get_hist(symbol=ticker,exchange='BINANCE',interval=Interval.in_5_minute,n_bars=1000,extended_session=False)
                if df is None:
                  row[kind]={'ok':False,'elapsed':round(time.time()-start,3),'error':'None result'}
                else:
                  path=Path(f'artifact/{symbol}.{kind}.csv')
                  df.to_csv(path)
                  row[kind]={'ok':True,'elapsed':round(time.time()-start,3),'rows':len(df),'columns':list(df.columns),'first_index':str(df.index[0]) if len(df) else None,'last_index':str(df.index[-1]) if len(df) else None,'first':df.iloc[0].to_dict() if len(df) else None,'last':df.iloc[-1].to_dict() if len(df) else None}
              except Exception as exc:
                row[kind]={'ok':False,'elapsed':round(time.time()-start,3),'error':f'{type(exc).__name__}: {exc}'}
            report['results'].append(row)
          Path('artifact/tvdatafeed_probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2,default=str))
          PY
      - name: Upload tvDatafeed probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-tvdatafeed-binance-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
