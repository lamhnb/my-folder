name: Temporary V1.15 Binance WebSocket probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe Binance Futures and Spot WebSocket APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'websockets>=14,<16'
          mkdir -p artifact
          python3 - <<'PY'
          import asyncio, json, time
          from datetime import datetime, timezone
          from pathlib import Path
          import websockets

          ROOT=Path('artifact')
          targets=[
            ('futures_ws_api','wss://ws-fapi.binance.com/ws-fapi/v1',[
              {'id':'f-time','method':'time','params':{}},
              {'id':'f-exchange','method':'exchangeInfo','params':{}},
              {'id':'f-ticker','method':'ticker.24hr','params':{'symbol':'BTCUSDT'}},
              {'id':'f-klines','method':'klines','params':{'symbol':'BTCUSDT','interval':'5m','limit':5}},
              {'id':'f-depth','method':'depth','params':{'symbol':'BTCUSDT','limit':20}},
              {'id':'f-oi','method':'openInterest','params':{'symbol':'BTCUSDT'}},
            ]),
            ('spot_ws_api','wss://ws-api.binance.com:443/ws-api/v3',[
              {'id':'s-time','method':'time','params':{}},
              {'id':'s-exchange','method':'exchangeInfo','params':{}},
              {'id':'s-ticker','method':'ticker.24hr','params':{'symbol':'BTCUSDT'}},
              {'id':'s-klines','method':'klines','params':{'symbol':'BTCUSDT','interval':'5m','limit':5}},
              {'id':'s-depth','method':'depth','params':{'symbol':'BTCUSDT','limit':20}},
            ]),
          ]
          streams=[
            ('futures_stream','wss://fstream.binance.com/ws/btcusdt@kline_5m'),
            ('futures_market_stream','wss://fstream.binance.com/market/ws/btcusdt@kline_5m'),
            ('spot_stream','wss://stream.binance.com:9443/ws/btcusdt@kline_5m'),
            ('spot_data_stream','wss://data-stream.binance.vision/ws/btcusdt@kline_5m'),
          ]
          results=[]

          async def probe_api(name,url,requests):
            item={'name':name,'url':url,'connected':False,'responses':[]}
            try:
              async with websockets.connect(url,open_timeout=15,close_timeout=5,ping_interval=15,ping_timeout=10,max_size=20_000_000) as ws:
                item['connected']=True
                for req in requests:
                  await ws.send(json.dumps(req,separators=(',',':')))
                deadline=time.monotonic()+25
                pending={r['id'] for r in requests}
                while pending and time.monotonic()<deadline:
                  try:
                    raw=await asyncio.wait_for(ws.recv(),timeout=max(.1,deadline-time.monotonic()))
                  except asyncio.TimeoutError:
                    break
                  parsed=json.loads(raw)
                  item['responses'].append(parsed)
                  if isinstance(parsed,dict) and parsed.get('id') in pending:
                    pending.remove(parsed['id'])
                item['pending']=sorted(pending)
            except Exception as exc:
              item['error']=f'{type(exc).__name__}: {exc}'
            return item

          async def probe_stream(name,url):
            item={'name':name,'url':url,'connected':False}
            try:
              async with websockets.connect(url,open_timeout=15,close_timeout=5,ping_interval=15,ping_timeout=10,max_size=5_000_000) as ws:
                item['connected']=True
                raw=await asyncio.wait_for(ws.recv(),timeout=12)
                parsed=json.loads(raw)
                item['event']=parsed
            except Exception as exc:
              item['error']=f'{type(exc).__name__}: {exc}'
            return item

          async def main():
            for name,url,requests in targets:
              results.append(await probe_api(name,url,requests))
            for name,url in streams:
              results.append(await probe_stream(name,url))

          asyncio.run(main())
          meta={'completed_at_utc':datetime.now(timezone.utc).isoformat(),'results':results}
          ROOT.joinpath('ws_probe.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - name: Upload WebSocket probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-binance-ws-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
