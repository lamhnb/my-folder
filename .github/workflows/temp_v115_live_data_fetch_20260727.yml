name: Temporary V1.15 current full-universe data fetch

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch current Binance USD-M universe and exact V1.15 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/symbols artifact/metadata
          python3 - <<'PY'
          import asyncio
          import gzip
          import json
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path('artifact')
          SYMBOL_DIR = ROOT / 'symbols'
          META_DIR = ROOT / 'metadata'
          FUTURES = 'https://api.pipai.org'
          SPOT = 'https://data-api.binance.vision'
          FUTURES_CONCURRENCY = 12
          SPOT_CONCURRENCY = 20
          RETRIES = 4
          TIMEOUT = 60
          KLINE_LIMIT = 400
          OI_LIMIT = 72
          DEPTH_LIMIT = 100

          def sync_get_json(base: str, path: str, params=None):
              query = '' if not params else '?' + urllib.parse.urlencode(params)
              url = base.rstrip('/') + path + query
              delay = 0.75
              last = None
              for attempt in range(RETRIES):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0 V1.15-current-full-scan',
                          'Accept': 'application/json',
                      })
                      with urllib.request.urlopen(req, timeout=TIMEOUT) as response:
                          raw = response.read().decode('utf-8')
                          return json.loads(raw)
                  except Exception as exc:
                      last = exc
                      if attempt + 1 >= RETRIES:
                          raise
                      time.sleep(delay)
                      delay = min(delay * 2.0, 8.0)
              raise last

          print('[META] fetching Futures exchange info/tickers/funding and Spot exchange info/tickers', flush=True)
          futures_info = sync_get_json(FUTURES, '/exchangeInfo')
          futures_tickers = sync_get_json(FUTURES, '/ticker/24hr')
          funding_rows = sync_get_json(FUTURES, '/funding/rates')
          spot_info = sync_get_json(SPOT, '/api/v3/exchangeInfo')
          spot_tickers = sync_get_json(SPOT, '/api/v3/ticker/24hr')

          universe = sorted(
              row['symbol'] for row in futures_info.get('symbols', [])
              if row.get('quoteAsset') == 'USDT'
              and row.get('contractType') == 'PERPETUAL'
              and row.get('status') == 'TRADING'
          )
          spot_set = {
              row['symbol'] for row in spot_info.get('symbols', [])
              if row.get('quoteAsset') == 'USDT'
              and row.get('status') == 'TRADING'
              and row.get('isSpotTradingAllowed', True)
          }
          futures_ticker_map = {row.get('symbol'): row for row in futures_tickers if isinstance(row, dict)}
          spot_ticker_map = {row.get('symbol'): row for row in spot_tickers if isinstance(row, dict)}
          funding_map = {row.get('symbol'): row for row in funding_rows if isinstance(row, dict)}

          snapshot_started_ms = int(time.time() * 1000)
          futures_sem = asyncio.Semaphore(FUTURES_CONCURRENCY)
          spot_sem = asyncio.Semaphore(SPOT_CONCURRENCY)
          progress = {'done': 0}
          source_errors = []

          async def call(base, path, params, sem):
              async with sem:
                  result = await asyncio.to_thread(sync_get_json, base, path, params)
                  await asyncio.sleep(0.025)
                  return result

          async def optional_call(source_name, base, path, params, sem, symbol, default):
              try:
                  return await call(base, path, params, sem)
              except Exception as exc:
                  source_errors.append({
                      'symbol': symbol,
                      'source': source_name,
                      'error': f'{type(exc).__name__}: {exc}',
                  })
                  return default

          async def fetch_symbol(symbol: str):
              futures_kline_task = optional_call(
                  'futures_5m', FUTURES, '/klines',
                  {'symbol': symbol, 'interval': '5m', 'limit': KLINE_LIMIT},
                  futures_sem, symbol, [],
              )
              oi_task = optional_call(
                  'oi_5m', FUTURES, '/openInterestHist',
                  {'symbol': symbol, 'period': '5m', 'limit': OI_LIMIT},
                  futures_sem, symbol, [],
              )
              depth_task = optional_call(
                  'depth_100', FUTURES, '/depth',
                  {'symbol': symbol, 'limit': DEPTH_LIMIT},
                  futures_sem, symbol, {},
              )
              include_spot = symbol in spot_set
              spot_task = (
                  optional_call(
                      'spot_5m', SPOT, '/api/v3/klines',
                      {'symbol': symbol, 'interval': '5m', 'limit': KLINE_LIMIT},
                      spot_sem, symbol, [],
                  ) if include_spot else asyncio.sleep(0, result=[])
              )
              futures_rows, oi_rows, depth, spot_rows = await asyncio.gather(
                  futures_kline_task, oi_task, depth_task, spot_task
              )
              payload = {
                  'symbol': symbol,
                  'fetched_at_utc': datetime.now(timezone.utc).isoformat(),
                  'fetched_at_ms': int(time.time() * 1000),
                  'has_binance_spot': include_spot,
                  'futures_24h': futures_ticker_map.get(symbol, {}),
                  'spot_24h': spot_ticker_map.get(symbol, {}),
                  'premium_index': funding_map.get(symbol, {}),
                  'futures_5m': futures_rows if isinstance(futures_rows, list) else [],
                  'spot_5m': spot_rows if isinstance(spot_rows, list) else [],
                  'oi_5m': oi_rows if isinstance(oi_rows, list) else [],
                  'depth_100': depth if isinstance(depth, dict) else {},
              }
              with gzip.open(SYMBOL_DIR / f'{symbol}.json.gz', 'wt', encoding='utf-8') as handle:
                  json.dump(payload, handle, ensure_ascii=False, separators=(',', ':'))
              progress['done'] += 1
              done = progress['done']
              if done % 25 == 0 or done == len(universe):
                  print(f'[FETCH] {done}/{len(universe)} symbols; source_errors={len(source_errors)}', flush=True)

          asyncio.run(asyncio.gather(*(fetch_symbol(symbol) for symbol in universe)))

          snapshot_completed_ms = int(time.time() * 1000)
          files = sorted(SYMBOL_DIR.glob('*.json.gz'))
          futures_kline_ok = 0
          spot_kline_ok = 0
          oi_ok = 0
          depth_ok = 0
          for path in files:
              with gzip.open(path, 'rt', encoding='utf-8') as handle:
                  row = json.load(handle)
              futures_kline_ok += int(len(row.get('futures_5m', [])) >= 60)
              spot_kline_ok += int(len(row.get('spot_5m', [])) >= 60)
              oi_ok += int(bool(row.get('oi_5m')))
              depth_ok += int(bool(row.get('depth_100', {}).get('bids')) and bool(row.get('depth_100', {}).get('asks')))

          metadata = {
              'status': 'COMPLETED' if futures_kline_ok >= int(len(universe) * 0.95) else 'PARTIAL',
              'snapshot_started_ms': snapshot_started_ms,
              'snapshot_started_utc': datetime.fromtimestamp(snapshot_started_ms / 1000, timezone.utc).isoformat(),
              'snapshot_completed_ms': snapshot_completed_ms,
              'snapshot_completed_utc': datetime.fromtimestamp(snapshot_completed_ms / 1000, timezone.utc).isoformat(),
              'universe_size': len(universe),
              'symbol_files': len(files),
              'symbols_with_futures_bars_60plus': futures_kline_ok,
              'symbols_with_spot_bars_60plus': spot_kline_ok,
              'symbols_with_oi': oi_ok,
              'symbols_with_depth': depth_ok,
              'spot_universe_count': len(spot_set),
              'source_errors': source_errors,
              'source_error_count': len(source_errors),
              'input_limits': {
                  'futures_5m': KLINE_LIMIT,
                  'spot_5m': KLINE_LIMIT,
                  'oi_5m': OI_LIMIT,
                  'depth': DEPTH_LIMIT,
              },
              'sources': {
                  'futures': 'Primit cache/gateway returning Binance USD-M public REST payloads',
                  'spot': 'Official Binance market-data-only REST endpoint data-api.binance.vision',
              },
          }
          (ROOT / 'meta.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'universe.json').write_text(json.dumps(universe, ensure_ascii=False, indent=2), encoding='utf-8')
          with gzip.open(META_DIR / 'futures_exchange_info.json.gz', 'wt', encoding='utf-8') as handle:
              json.dump(futures_info, handle, ensure_ascii=False, separators=(',', ':'))
          with gzip.open(META_DIR / 'spot_exchange_info.json.gz', 'wt', encoding='utf-8') as handle:
              json.dump(spot_info, handle, ensure_ascii=False, separators=(',', ':'))
          print(json.dumps(metadata, ensure_ascii=False, indent=2), flush=True)
          if futures_kline_ok < int(len(universe) * 0.90):
              raise SystemExit('Insufficient Futures kline coverage for full-universe scan')
          PY
      - name: Upload current full-universe inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-current-full-universe-inputs-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
