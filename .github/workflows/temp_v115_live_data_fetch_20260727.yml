name: Temporary TradingView Binance futures data probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe TradingView Binance perpetual candles and OI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact tvprobe
          cd tvprobe
          npm init -y >/dev/null 2>&1
          npm install --silent tvws
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { connect, getCandles } from 'tvws';

          const symbols = ['BTCUSDT','DIAUSDT','EULUSDT','PRLUSDT','BANKUSDT','ZAMAUSDT'];
          const report = { checked_at_utc: new Date().toISOString(), package: 'tvws', results: [] };
          let connection;
          try {
            connection = await connect({ endpoint: 'data' });
            for (const symbol of symbols) {
              const row = { symbol };
              for (const [kind, tvSymbol] of [
                ['price', `BINANCE:${symbol}.P`],
                ['oi', `BINANCE:${symbol}.P_OI`],
              ]) {
                const started = Date.now();
                try {
                  const result = await getCandles({
                    connection,
                    symbols: [tvSymbol],
                    amount: 1000,
                    timeframe: '5',
                  });
                  row[kind] = {
                    ok: true,
                    elapsed_ms: Date.now() - started,
                    type: Array.isArray(result) ? 'array' : typeof result,
                    count: Array.isArray(result) ? result.length : null,
                    keys: result && typeof result === 'object' && !Array.isArray(result) ? Object.keys(result) : null,
                    sample_first: Array.isArray(result) ? result[0] : result,
                    sample_last: Array.isArray(result) ? result[result.length - 1] : null,
                  };
                  fs.writeFileSync(`../artifact/${symbol}.${kind}.json`, JSON.stringify(result));
                } catch (error) {
                  row[kind] = { ok: false, elapsed_ms: Date.now() - started, error: `${error?.name || 'Error'}: ${error?.message || error}` };
                }
              }
              report.results.push(row);
            }
          } catch (error) {
            report.connection_error = `${error?.name || 'Error'}: ${error?.message || error}`;
          } finally {
            try { await connection?.close(); } catch {}
          }
          fs.writeFileSync('../artifact/tv_probe.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          JS
      - name: Upload TradingView probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-tradingview-binance-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
