name: Temporary V1.15 Primit market-data probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Probe current futures data endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT=Path('artifact')
          BASE='https://api.pipai.org'
          specs=[
            ('health','/health',{}),
            ('active','/ticker/24hr/active',{}),
            ('btc_klines','/fapi/v1/klines',{'symbol':'BTCUSDT','interval':'5m','limit':10}),
            ('dia_klines','/fapi/v1/klines',{'symbol':'DIAUSDT','interval':'5m','limit':10}),
            ('btc_oi','/openInterestHist',{'symbol':'BTCUSDT','period':'5m','limit':10}),
            ('btc_premium','/fapi/v1/premiumIndex',{'symbol':'BTCUSDT'}),
            ('funding_all','/funding/rates',{}),
          ]
          results=[]
          for name,path,params in specs:
            url=BASE+path+('?' + urllib.parse.urlencode(params) if params else '')
            started=time.monotonic()
            item={'name':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 V1.15-probe','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r:
                raw=r.read()
                item['status']=r.status
                item['elapsed_seconds']=round(time.monotonic()-started,3)
                item['bytes']=len(raw)
                try:
                  parsed=json.loads(raw.decode('utf-8'))
                  item['type']=type(parsed).__name__
                  item['length']=len(parsed) if hasattr(parsed,'__len__') else None
                  if name in ('health','btc_premium'):
                    item['sample']=parsed
                  elif isinstance(parsed,list):
                    item['sample']=parsed[:2]
                  elif isinstance(parsed,dict):
                    item['keys']=list(parsed)[:30]
                    item['sample']={k:parsed[k] for k in list(parsed)[:5]}
                except Exception as exc:
                  item['parse_error']=f'{type(exc).__name__}: {exc}'
                  item['text_prefix']=raw[:500].decode('utf-8',errors='replace')
            except Exception as exc:
              item['elapsed_seconds']=round(time.monotonic()-started,3)
              item['error']=f'{type(exc).__name__}: {exc}'
            results.append(item)
            print(json.dumps(item,ensure_ascii=False),flush=True)
          meta={'completed_at_utc':datetime.now(timezone.utc).isoformat(),'results':results}
          ROOT.joinpath('probe.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload endpoint probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-primit-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
