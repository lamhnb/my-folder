name: Temporary V1.15 July-26 archive availability probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official Binance Data Vision July 26 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          from pathlib import Path
          from datetime import datetime, timezone

          symbols=['BTCUSDT','DIAUSDT','EULUSDT','PRLUSDT','BANKUSDT','ZAMAUSDT']
          groups=[
            ('futures','https://data.binance.vision/data/futures/um/daily/klines/{s}/5m/{s}-5m-2026-07-26.zip'),
            ('spot','https://data.binance.vision/data/spot/daily/klines/{s}/5m/{s}-5m-2026-07-26.zip'),
            ('metrics','https://data.binance.vision/data/futures/um/daily/metrics/{s}/{s}-metrics-2026-07-26.zip'),
          ]
          rows=[]
          for s in symbols:
            for group,template in groups:
              url=template.format(s=s)
              started=time.time()
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 V1.15-archive-probe','Range':'bytes=0-31'})
                with urllib.request.urlopen(req,timeout=45) as r:
                  body=r.read(32)
                  rows.append({'symbol':s,'group':group,'url':url,'status':getattr(r,'status',None),'available':True,'content_length':r.headers.get('Content-Length'),'content_range':r.headers.get('Content-Range'),'head_hex':body.hex(),'elapsed':round(time.time()-started,3)})
              except urllib.error.HTTPError as exc:
                rows.append({'symbol':s,'group':group,'url':url,'status':exc.code,'available':False,'error':str(exc),'elapsed':round(time.time()-started,3)})
              except Exception as exc:
                rows.append({'symbol':s,'group':group,'url':url,'available':False,'error':f'{type(exc).__name__}: {exc}','elapsed':round(time.time()-started,3)})
          report={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'available_count':sum(1 for x in rows if x['available']),'rows':rows}
          Path('artifact/archive_probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload archive availability probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-july26-archive-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
