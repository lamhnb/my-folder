name: Temporary V1.15 Binance archive probe

on:
  pull_request:
    paths:
      - 'temp/v115_live_scan_request_20260727.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official Binance Data Vision S3 bucket
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT=Path('artifact')
          LIST_BASE='https://s3-ap-northeast-1.amazonaws.com/data.binance.vision'

          def get(url, timeout=60):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 V1.15-archive-probe'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(), dict(r.headers)

          def list_prefixes(prefix, filename):
              url=LIST_BASE+'?'+urllib.parse.urlencode({'list-type':'2','prefix':prefix,'delimiter':'/'})
              raw,_=get(url)
              ROOT.joinpath(filename).write_bytes(raw)
              root=ET.fromstring(raw)
              ns={'s3':'http://s3.amazonaws.com/doc/2006-03-01/'}
              prefixes=[node.text for node in root.findall('.//s3:CommonPrefixes/s3:Prefix',ns)]
              if not prefixes:
                  prefixes=[node.text for node in root.findall('.//CommonPrefixes/Prefix')]
              return prefixes,url

          fut_prefixes,fut_url=list_prefixes('data/futures/um/daily/klines/','futures_listing.xml')
          spot_prefixes,spot_url=list_prefixes('data/spot/daily/klines/','spot_listing.xml')
          futures_symbols=sorted({p.rstrip('/').split('/')[-1] for p in fut_prefixes})
          spot_symbols=sorted({p.rstrip('/').split('/')[-1] for p in spot_prefixes})

          probes=[]
          for symbol in ['BTCUSDT','DIAUSDT','EULUSDT','PRLUSDT']:
              for market,prefix in [('futures','futures/um/daily/klines'),('spot','spot/daily/klines')]:
                  name=f'{symbol}-5m-2026-07-26.zip'
                  url=f'https://data.binance.vision/data/{prefix}/{symbol}/5m/{name}'
                  try:
                      raw,headers=get(url)
                      probes.append({'symbol':symbol,'market':market,'status':200,'bytes':len(raw),'last_modified':headers.get('Last-Modified'),'url':url})
                  except Exception as exc:
                      probes.append({'symbol':symbol,'market':market,'status':'ERROR','error':f'{type(exc).__name__}: {exc}','url':url})

          meta={
              'status':'COMPLETED',
              'completed_at_utc':datetime.now(timezone.utc).isoformat(),
              'futures_listing_url':fut_url,
              'spot_listing_url':spot_url,
              'futures_symbol_count':len(futures_symbols),
              'spot_symbol_count':len(spot_symbols),
              'futures_symbols':futures_symbols,
              'spot_symbols':spot_symbols,
              'probes':probes,
              'source':'Official Binance Data Vision public S3 bucket',
          }
          ROOT.joinpath('meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-binance-archive-probe-20260727
          path: artifact
          if-no-files-found: error
          retention-days: 2
