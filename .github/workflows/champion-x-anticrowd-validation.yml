name: Champion-X Anti-Crowd Out-of-Time Validation
on:
  push:
    branches:
      - research/power655-champion-x-input-sensitivity-20261025
    paths:
      - vietlott-power655-research/challengers/champion_x_anticrowd_validation_20261103.py
      - .github/workflows/champion-x-anticrowd-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test prelocked training split against later years
        run: python vietlott-power655-research/challengers/champion_x_anticrowd_validation_20261103.py
      - name: Upload evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-x-anticrowd-validation
          path: vietlott-power655-research/challengers/anticrowd_validation_outputs/
          if-no-files-found: warn
