name: Champion-X Player Choice Prize Tier Audit
on:
  push:
    branches:
      - research/power655-champion-x-input-sensitivity-20261025
    paths:
      - vietlott-power655-research/challengers/champion_x_player_choice_prize_tier_audit_20261103.py
      - .github/workflows/champion-x-player-choice-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit external prize-tier data (strict provenance)
        run: python vietlott-power655-research/challengers/champion_x_player_choice_prize_tier_audit_20261103.py
      - name: Publish audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-x-player-choice-prize-tier-audit
          path: vietlott-power655-research/challengers/jackpot_player_choice_outputs/
          if-no-files-found: warn
