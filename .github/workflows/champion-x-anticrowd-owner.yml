name: Champion-X Anti-Crowd Jackpot Owner Holdout
on:
  push:
    branches:
      - research/power655-champion-x-input-sensitivity-20261025
    paths:
      - vietlott-power655-research/challengers/champion_x_anticrowd_owner_holdout_20261103.py
      - .github/workflows/champion-x-anticrowd-owner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Score Jackpot owner models on locked later years
        run: python vietlott-power655-research/challengers/champion_x_anticrowd_owner_holdout_20261103.py
      - name: Upload evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-x-anticrowd-owner-holdout
          path: vietlott-power655-research/challengers/anticrowd_owner_outputs/
          if-no-files-found: warn
